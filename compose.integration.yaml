services:
  postgres-integration:
    image: postgres:18.0-bookworm
    environment:
      POSTGRES_DB: gutcare_business_test
      POSTGRES_USER: gutcare_bootstrap
      POSTGRES_PASSWORD: ${GUTCARE_TEST_BOOTSTRAP_PASSWORD:-gutcare-test-bootstrap-only}
      GUTCARE_MIGRATOR_PASSWORD: ${GUTCARE_TEST_MIGRATOR_PASSWORD:-gutcare-test-migrator-only}
      GUTCARE_APP_PASSWORD: ${GUTCARE_TEST_APP_PASSWORD:-gutcare-test-app-only}
      GUTCARE_WORKER_PASSWORD: ${GUTCARE_TEST_WORKER_PASSWORD:-gutcare-test-worker-only}
      GUTCARE_ANALYSIS_WORKER_PASSWORD: ${GUTCARE_TEST_ANALYSIS_WORKER_PASSWORD:-gutcare-test-analysis-worker-only}
      GUTCARE_NOTIFICATION_WORKER_PASSWORD: ${GUTCARE_TEST_NOTIFICATION_WORKER_PASSWORD:-gutcare-test-notification-worker-only}
      GUTCARE_PRIVACY_WORKER_PASSWORD: ${GUTCARE_TEST_PRIVACY_WORKER_PASSWORD:-gutcare-test-privacy-worker-only}
    ports:
      - "127.0.0.1:${GUTCARE_TEST_PG18_HOST_PORT:-55432}:5432"
    tmpfs:
      - /var/lib/postgresql:rw,noexec,nosuid,size=1g
    volumes:
      - ./infra/postgres/init/010-gutcare-roles.sh:/docker-entrypoint-initdb.d/010-gutcare-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  redis-auth-e2e:
    profiles: ["auth-e2e"]
    image: redis:8.0.2-bookworm
    command: ["sh", "-ec", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ${GUTCARE_E2E_REDIS_PASSWORD:-unused-auth-e2e-only}
    ports:
      - "127.0.0.1:${GUTCARE_E2E_REDIS_HOST_PORT:-56379}:6379"
    tmpfs:
      - /data:rw,noexec,nosuid,size=128m
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 2s
      timeout: 3s
      retries: 30

  mailpit-auth-e2e:
    profiles: ["auth-e2e"]
    image: axllent/mailpit:v1.27.8
    ports:
      - "127.0.0.1:${GUTCARE_E2E_MAILPIT_SMTP_HOST_PORT:-51025}:1025"
      - "127.0.0.1:${GUTCARE_E2E_MAILPIT_API_HOST_PORT:-58025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 3s
      retries: 30

  minio-integration:
    image: gutcare-minio-integration:RELEASE.2025-09-07T16-13-09Z
    build:
      context: .downloads/minio-context
      dockerfile: Dockerfile
    environment:
      MINIO_ROOT_USER: gutcare_test_storage
      MINIO_ROOT_PASSWORD: gutcare-test-storage-only
    ports:
      - "127.0.0.1:${GUTCARE_TEST_MINIO_HOST_PORT:-59000}:9000"
    tmpfs:
      - /data:rw,noexec,nosuid,size=512m,uid=999,gid=999

  clamav-integration:
    image: clamav/clamav:1.5.4-debian13-slim
    ports:
      - "127.0.0.1:${GUTCARE_TEST_CLAMAV_HOST_PORT:-13310}:3310"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          clamdscan --ping 1 >/dev/null 2>&1
          && clamdscan --version | grep -Eq 'ClamAV [0-9].*/[1-9][0-9]*/'
          && test -s /var/lib/clamav/main.cvd
          && test -s /var/lib/clamav/daily.cld
          && test -s /var/lib/clamav/bytecode.cvd
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 60s
