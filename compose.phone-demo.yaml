# Isolated, test/demo-only topology for a physical-phone HTTPS walkthrough.
# Do not add this file to the production deployment path.
name: gutcare-phone-demo

services:
  postgres:
    image: postgres:18.0-bookworm
    environment:
      POSTGRES_DB: gutcare_phone_demo
      POSTGRES_USER: gutcare_bootstrap
      POSTGRES_PASSWORD: ${POSTGRES_BOOTSTRAP_PASSWORD:?Generated by phone-demo-up.ps1}
      GUTCARE_MIGRATOR_PASSWORD: ${GUTCARE_MIGRATOR_PASSWORD:?Generated by phone-demo-up.ps1}
      GUTCARE_APP_PASSWORD: ${GUTCARE_APP_PASSWORD:?Generated by phone-demo-up.ps1}
      GUTCARE_WORKER_PASSWORD: ${GUTCARE_WORKER_PASSWORD:?Generated by phone-demo-up.ps1}
      GUTCARE_ANALYSIS_WORKER_PASSWORD: ${GUTCARE_ANALYSIS_WORKER_PASSWORD:?Generated by phone-demo-up.ps1}
      GUTCARE_NOTIFICATION_WORKER_PASSWORD: ${GUTCARE_NOTIFICATION_WORKER_PASSWORD:?Generated by phone-demo-up.ps1}
      GUTCARE_PRIVACY_WORKER_PASSWORD: ${GUTCARE_PRIVACY_WORKER_PASSWORD:?Generated by phone-demo-up.ps1}
    volumes:
      - phone_demo_postgres:/var/lib/postgresql/18/docker
      - ./infra/postgres/init/010-gutcare-roles.sh:/docker-entrypoint-initdb.d/010-gutcare-roles.sh:ro
    networks: [private]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  redis:
    image: redis:8.0.2-bookworm
    command: ["sh", "-ec", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Generated by phone-demo-up.ps1}
    volumes:
      - phone_demo_redis:/data
    networks: [private]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 30

  mailpit:
    image: axllent/mailpit:v1.27.8
    ports:
      - "127.0.0.1:8025:8025"
    volumes:
      - phone_demo_mailpit:/data
    # Mailpit needs the edge network only for its loopback-bound UI port. SMTP
    # traffic from api remains on private.
    networks: [private, edge]
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 30

  minio:
    image: gutcare-minio-integration:RELEASE.2025-09-07T16-13-09Z
    build:
      context: .downloads/minio-context
      dockerfile: Dockerfile
    environment:
      MINIO_ROOT_USER: gutcare_phone_demo_storage
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Generated by phone-demo-up.ps1}
    volumes:
      - phone_demo_minio:/data
    networks: [private]
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/9000'"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  minio-init:
    image: gutcare-phone-demo-minio-init:local
    build:
      context: .downloads/phone-demo-minio-init-context
      dockerfile: Dockerfile
    command: ["python", "/usr/local/bin/phone-demo-minio-init.py"]
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: gutcare_phone_demo_storage
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Generated by phone-demo-up.ps1}
      MINIO_APP_ACCESS_KEY: ${MINIO_APP_ACCESS_KEY:?Generated by phone-demo-up.ps1}
      MINIO_APP_SECRET_KEY: ${MINIO_APP_SECRET_KEY:?Generated by phone-demo-up.ps1}
      MINIO_BUCKET: gutcare-phone-demo-files
      MINIO_POLICY_PATH: /usr/local/share/phone-demo-app-policy.json
    networks: [private]
    depends_on:
      minio:
        condition: service_healthy

  api:
    image: gutcare-phone-demo-api:local
    build:
      context: .
      dockerfile: backend/Dockerfile.phone-demo
    environment:
      APP_ENV: local
      RISK_TEST_ONLY_RULES_ENABLED: "true"
      APP_PUBLIC_BASE_URL: http://127.0.0.1:8000
      DATABASE_URL: postgresql+psycopg://gutcare_app:${GUTCARE_APP_PASSWORD:?Generated by phone-demo-up.ps1}@postgres:5432/gutcare_phone_demo
      MIGRATOR_DATABASE_URL: postgresql+psycopg://gutcare_migrator:${GUTCARE_MIGRATOR_PASSWORD:?Generated by phone-demo-up.ps1}@postgres:5432/gutcare_phone_demo
      REDIS_URL: redis://:${REDIS_PASSWORD:?Generated by phone-demo-up.ps1}@redis:6379/0
      MAIL_SMTP_HOST: mailpit
      MAIL_SMTP_PORT: "1025"
      MAIL_SENDER: no-reply@gutcare.invalid
      MAIL_STARTTLS: "false"
      AUTH_EMAIL_LOOKUP_PEPPER: ${AUTH_EMAIL_LOOKUP_PEPPER:?Generated by phone-demo-up.ps1}
      AUTH_EMAIL_ENCRYPTION_KEY: ${AUTH_EMAIL_ENCRYPTION_KEY:?Generated by phone-demo-up.ps1}
      AUTH_JWT_SIGNING_KEY: ${AUTH_JWT_SIGNING_KEY:?Generated by phone-demo-up.ps1}
      MOOD_IDEMPOTENCY_HMAC_KEY: ${MOOD_IDEMPOTENCY_HMAC_KEY:?Generated by phone-demo-up.ps1}
      EXPORT_KEK: ${EXPORT_KEK:?Generated by phone-demo-up.ps1}
      PRIVACY_POLICY_SUMMARY_HASH: e17c133d1e39a51c8b4370fce470196f24b50ec099edbd1d7f6dedd4c8672991
      PRIVACY_POLICY_VERSION: test-only-privacy-v1
      HEALTH_DATA_PROCESSING_SUMMARY_HASH: c3c38f369746498cab3b6e9c96bfda09c42230e44e257d56dc47c972e5139be1
      HEALTH_DATA_PROCESSING_POLICY_VERSION: test-only-health-v1
      PRIVACY_CONSENT_NOTICES_PATH: /srv/contracts/consent/consent-notices.json
      MOOD_DATA_PROCESSING_SUMMARY_HASH: 7d30d978677482a02db144506c80aed867dcc395b82a96a4a1eda90a87c578e4
      MOOD_DATA_PROCESSING_POLICY_VERSION: test-only-mood-data-v1
      MOOD_AI_SHARING_SUMMARY_HASH: b21634c2767bb3134f265cd057eac0e3a1d2363b93850400190e4a20f18f0de8
      MOOD_AI_SHARING_POLICY_VERSION: test-only-mood-ai-v1
      THIRD_PARTY_AI_SUMMARY_HASH: 37ae67bc63b6571098aeda40b399ba03ae65270d7aaa451484d06279cdcaa95b
      THIRD_PARTY_AI_POLICY_VERSION: test-only-third-party-ai-v1
      # Phone-demo only: synthetic/test-only sensitive-image consent terms.
      # This does not authorize real patient uploads or production processing.
      SENSITIVE_IMAGE_POLICY_VERSION: test-only-image-v1
      SENSITIVE_IMAGE_SUMMARY_HASH: 0ecb061307cde86f99432c84ca451c9b692946648a9b9d550f7c53b80956aa06
      PRIVACY_RECORD_IMAGE_DISCLOSURES_PATH: /srv/contracts/consent/record-image-recognition-notices.json
      DIET_IMAGE_RECOGNITION_POLICY_VERSION: test-only-diet-image-v2
      DIET_IMAGE_RECOGNITION_SUMMARY_HASH: 201772595b593891b96e98abc2bc29f1d89fa960051eaa9414399092818acefa
      STOOL_IMAGE_RECOGNITION_POLICY_VERSION: test-only-stool-image-v2
      STOOL_IMAGE_RECOGNITION_SUMMARY_HASH: 12245ce86d857e422dc2f0d5b9bfc2ebfebe4a523b72180b22d45aa57e2ebc1e
      FILES_ENDPOINT: http://minio:9000
      FILES_ACCESS_KEY: ${MINIO_APP_ACCESS_KEY:?Generated by phone-demo-up.ps1}
      FILES_SECRET_KEY: ${MINIO_APP_SECRET_KEY:?Generated by phone-demo-up.ps1}
      FILES_BUCKET: gutcare-phone-demo-files
      FILES_CLAMAV_HOST: clamav
      FILES_CLAMAV_PORT: "3310"
      FILES_CAPABILITY_SECRET: ${FILES_CAPABILITY_SECRET:?Generated by phone-demo-up.ps1}
      ANALYSIS_WORKER_DATABASE_URL: postgresql+psycopg://gutcare_analysis_worker:${GUTCARE_ANALYSIS_WORKER_PASSWORD:?Generated by phone-demo-up.ps1}@postgres:5432/gutcare_phone_demo
      AGENT_SERVICE_TOKEN: ${AGENT_SERVICE_TOKEN:?Generated by phone-demo-up.ps1}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./contracts:/srv/contracts:ro
    # `internal: true` networks cannot publish host ports on Docker Desktop.
    # Keep database/Redis traffic private while publishing this API only to
    # loopback through edge.
    networks: [private, edge, agent_internal]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      clamav:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; assert urlopen('http://127.0.0.1:8000/health/live', timeout=2).status == 200"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  medication-materializer:
    image: gutcare-phone-demo-api:local
    profiles: [e2e]
    command: ["python", "-m", "gutcare.medication.worker"]
    environment:
      MEDICATION_WORKER_DATABASE_URL: postgresql+psycopg://gutcare_worker:${GUTCARE_WORKER_PASSWORD:?Generated by phone-demo-up.ps1}@postgres:5432/gutcare_phone_demo
    networks: [private]
    depends_on:
      postgres:
        condition: service_healthy

  analysis-dispatcher:
    image: gutcare-phone-demo-api:local
    profiles: [agent]
    command: ["python", "-m", "gutcare.analysis.worker"]
    environment:
      F08_BUSINESS_API_URL: http://api:8000
      F08_AGENT_API_URL: http://agent:8100
      AGENT_SERVICE_TOKEN: ${AGENT_SERVICE_TOKEN:?Generated by phone-demo-up.ps1}
      AGENT_INTERNAL_TOKEN: ${AGENT_INTERNAL_TOKEN:?Generated by phone-demo-up.ps1}
      F08_WORKER_POLL_SECONDS: "2"
      F08_WORKER_TIMEOUT_SECONDS: "15"
    networks: [agent_internal]
    depends_on:
      api:
        condition: service_healthy
      agent:
        condition: service_healthy

  record-image-dispatcher:
    image: gutcare-phone-demo-api:local
    profiles: [agent]
    command: ["python", "-m", "gutcare.records.image_dispatcher"]
    environment:
      ANALYSIS_WORKER_DATABASE_URL: postgresql+psycopg://gutcare_analysis_worker:${GUTCARE_ANALYSIS_WORKER_PASSWORD:?Generated by phone-demo-up.ps1}@postgres:5432/gutcare_phone_demo
      F03_F04_BACKEND_API_URL: http://api:8000
      F03_F04_AGENT_API_URL: http://agent:8100
      AGENT_SERVICE_TOKEN: ${AGENT_SERVICE_TOKEN:?Generated by phone-demo-up.ps1}
      AGENT_INTERNAL_TOKEN: ${AGENT_INTERNAL_TOKEN:?Generated by phone-demo-up.ps1}
      F03_F04_WORKER_POLL_SECONDS: "2"
      F03_F04_DISPATCH_TIMEOUT_SECONDS: "15"
    volumes:
      # Dev/demo-only source overlay for no-build runs; does not cover /opt/venv.
      - ./backend/src:/srv/backend/src:ro
    networks: [private, agent_internal]
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
      agent:
        condition: service_healthy

  agent:
    image: gutcare-phone-demo-agent:local
    profiles: [agent]
    build:
      context: ./agent
      dockerfile: Dockerfile
    environment:
      GCA_HOST: 0.0.0.0
      GCA_PORT: "8100"
      # Keep mock as the safe default; exported PowerShell variables can opt into live.
      GCA_MODE: "${GCA_MODE:-mock}"
      GCA_TEST_IMAGE_CANDIDATES: "${GCA_TEST_IMAGE_CANDIDATES:-0}"
      GCA_API_KEY: "${GCA_API_KEY:-}"
      GCA_BASE_URL: "${GCA_BASE_URL:-}"
      GCA_TEXT_MODEL: "${GCA_TEXT_MODEL:-}"
      GCA_VISION_MODEL: "${GCA_VISION_MODEL:-}"
      GCA_INTERNAL_TOKEN: ${AGENT_INTERNAL_TOKEN:?Generated by phone-demo-up.ps1}
      GCA_BACKEND_BASE_URL: http://api:8000
      GCA_BACKEND_SERVICE_TOKEN: ${AGENT_SERVICE_TOKEN:?Generated by phone-demo-up.ps1}
      GCA_DB: /app/data/gutcare_agents.sqlite3
    volumes:
      - phone_demo_agent_sqlite:/app/data
      # Dev/demo-only source overlays: run the current Agent code without
      # rebuilding the image. Keep the private SQLite journal in its volume.
      - ./agent/gutcare_agents:/app/gutcare_agents:ro
      - ./agent/knowledge:/app/knowledge:ro
      - ./agent/prompts:/app/prompts:ro
    networks: [agent_internal]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; assert urllib.request.urlopen('http://127.0.0.1:8100/healthz', timeout=2).status == 200"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  clamav:
    image: clamav/clamav:1.5.4-debian13-slim
    volumes:
      - phone_demo_clamav:/var/lib/clamav
    # The private app network is isolated; ClamAV also needs outbound access
    # to fetch its official signature database. No scanner port is published.
    networks: [private, scanner-egress]
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          clamdscan --ping 1 >/dev/null 2>&1
          && clamdscan --version | grep -Eq 'ClamAV [0-9].*/[1-9][0-9]*/'
          && test -s /var/lib/clamav/main.cvd
          && test -s /var/lib/clamav/daily.cld
          && test -s /var/lib/clamav/bytecode.cvd
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 60s

networks:
  private:
    internal: true
  agent_internal:
    internal: true
  scanner-egress: {}
  edge: {}

volumes:
  phone_demo_postgres:
  phone_demo_redis:
  phone_demo_mailpit:
  phone_demo_minio:
  phone_demo_clamav:
  phone_demo_agent_sqlite:
