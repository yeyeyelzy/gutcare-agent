      responses: {'200': {description: Five-minute capability URL; request a fresh grant for each preview, content: {application/json: {schema: {$ref: '#/components/schemas/DownloadGrant'}}}}, '401': {$ref: '#/components/responses/Problem'}, '404': {$ref: '#/components/responses/Problem'}}
  /dietary-records/{record_id}/image-recognition-requests:
