          description: 从原不可变快照创建的新尝试
          headers:
            Location: {description: 新任务资源地址, schema: {type: string, format: uri-reference}}
          content: {application/json: {schema: {$ref: '#/components/schemas/AnalysisTask'}}}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /advice:
    get:
      summary: 列出当前患者建议
      tags: [Advice]
      operationId: listAdvice
      parameters:
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
        - {name: cursor, in: query, schema: {type: string, minLength: 1, maxLength: 128}, description: 稳定 created_at/id 降序游标}
      responses:
        '200': {description: 患者建议分页, content: {application/json: {schema: {$ref: '#/components/schemas/AdvicePage'}}}}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
  /advice/{advice_id}:
    parameters:
      - {name: advice_id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      summary: 获取建议详情与受控证据入口
      tags: [Advice]
      operationId: getAdvice
      responses:
        '200': {description: 建议详情, content: {application/json: {schema: {$ref: '#/components/schemas/Advice'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /advice/{advice_id}/read:
    post:
      summary: 标记建议已读
      tags: [Advice]
      operationId: readAdvice
      parameters: [{name: advice_id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200': {description: 建议已读，依据变化字段独立保留, content: {application/json: {schema: {$ref: '#/components/schemas/Advice'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /advice/{advice_id}/archive:
    post:
      summary: 归档建议
      tags: [Advice]
      operationId: archiveAdvice
      parameters: [{name: advice_id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200': {description: 建议已归档，依据变化字段独立保留, content: {application/json: {schema: {$ref: '#/components/schemas/Advice'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /advice/{advice_id}/feedback:
    put:
      summary: 新增或更新结构化建议反馈
      tags: [Advice]
      operationId: updateAdviceFeedback
      parameters:
        - {name: advice_id, in: path, required: true, schema: {type: string, format: uuid}}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AdviceFeedbackRequest'}}}}
      responses:
        '200': {description: 反馈版本, content: {application/json: {schema: {$ref: '#/components/schemas/AdviceFeedback'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /medication-plans:
    get:
      tags: [Medication]
      operationId: listMedicationPlans
      responses:
        '200': {description: Current patient's plans, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/MedicationPlan'}}}}}
        '401': {$ref: '#/components/responses/Problem'}
    post:
      tags: [Medication]
      operationId: createMedicationPlan
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/MedicationPlanCreate'}}}}
      responses:
        '201': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/MedicationPlan'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /medication-plans/{plan_id}:
    get:
      tags: [Medication]
      operationId: getMedicationPlan
      parameters: [{name: plan_id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses: {'200': {description: Plan, content: {application/json: {schema: {$ref: '#/components/schemas/MedicationPlan'}}}}, '401': {$ref: '#/components/responses/Problem'}, '404': {$ref: '#/components/responses/Problem'}}
    patch:
      tags: [Medication]
      operationId: updateMedicationPlan
      parameters: [{name: plan_id, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/MedicationPlanPatch'}}}}
      responses: {'200': {description: Updated plan, content: {application/json: {schema: {$ref: '#/components/schemas/MedicationPlan'}}}}, '401': {$ref: '#/components/responses/Problem'}, '404': {$ref: '#/components/responses/Problem'}, '409': {$ref: '#/components/responses/Problem'}, '422': {$ref: '#/components/responses/Problem'}}
    delete:
      tags: [Medication]
      operationId: deleteMedicationPlan
      parameters: [{name: plan_id, in: path, required: true, schema: {type: string, format: uuid}}, {name: record_version, in: query, required: true, schema: {type: integer, minimum: 1}}]
      responses: {'204': {description: Soft deleted; history retained}, '401': {$ref: '#/components/responses/Problem'}, '404': {$ref: '#/components/responses/Problem'}, '409': {$ref: '#/components/responses/Problem'}}
  /medication-plans/{plan_id}/transitions:
    post:
      tags: [Medication]
      operationId: transitionMedicationPlan
      parameters: [{name: plan_id, in: path, required: true, schema: {type: string, format: uuid}}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/MedicationPlanTransition'}}}}
      responses: {'200': {description: Updated plan, content: {application/json: {schema: {$ref: '#/components/schemas/MedicationPlan'}}}}, '401': {$ref: '#/components/responses/Problem'}, '404': {$ref: '#/components/responses/Problem'}, '409': {$ref: '#/components/responses/Problem'}, '422': {$ref: '#/components/responses/Problem'}}
  /medication-plans/{plan_id}/schedules:
    get:
      tags: [Medication]
      operationId: listMedicationSchedules
      parameters: [{name: plan_id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses: {'200': {description: Plan schedules, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/MedicationSchedule'}}}}}, '401': {$ref: '#/components/responses/Problem'}, '404': {$ref: '#/components/responses/Problem'}}
    post:
      tags: [Medication]
      operationId: createMedicationSchedule
      parameters: [{name: plan_id, in: path, required: true, schema: {type: string, format: uuid}}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/MedicationScheduleWrite'}}}}
      responses: {'201': {description: Created schedule, content: {application/json: {schema: {$ref: '#/components/schemas/MedicationSchedule'}}}}, '401': {$ref: '#/components/responses/Problem'}, '404': {$ref: '#/components/responses/Problem'}, '422': {$ref: '#/components/responses/Problem'}}
  /medication-schedules/{schedule_id}:
    patch:
      tags: [Medication]
      operationId: updateMedicationSchedule
      parameters: [{name: schedule_id, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/MedicationScheduleWrite'}}}}
      responses: {'200': {description: Updated schedule, content: {application/json: {schema: {$ref: '#/components/schemas/MedicationSchedule'}}}}, '401': {$ref: '#/components/responses/Problem'}, '404': {$ref: '#/components/responses/Problem'}, '409': {$ref: '#/components/responses/Problem'}, '422': {$ref: '#/components/responses/Problem'}}
    delete:
      tags: [Medication]
      operationId: deleteMedicationSchedule
      parameters: [{name: schedule_id, in: path, required: true, schema: {type: string, format: uuid}}, {name: record_version, in: query, required: true, schema: {type: integer, minimum: 1}}]
      responses: {'204': {description: Schedule disabled and soft deleted; history retained}, '401': {$ref: '#/components/responses/Problem'}, '404': {$ref: '#/components/responses/Problem'}, '409': {$ref: '#/components/responses/Problem'}}
  /medication-checkins:
    get:
      tags: [Medication]
      operationId: listMedicationCheckins
      parameters: [{name: start, in: query, required: true, schema: {type: string, format: date}}, {name: end, in: query, required: true, schema: {type: string, format: date}}]
      responses: {'200': {description: Checkins in an inclusive range up to 93 days, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/MedicationCheckin'}}}}}, '401': {$ref: '#/components/responses/Problem'}, '422': {$ref: '#/components/responses/Problem'}}
  /medication-checkins/today:
    get:
      tags: [Medication]
      operationId: listTodayMedicationCheckins
      responses: {'200': {description: Today's checkins, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/MedicationCheckin'}}}}}, '401': {$ref: '#/components/responses/Problem'}}
  /medication-checkins/{checkin_id}:
    patch:
      tags: [Medication]
      operationId: updateMedicationCheckin
      parameters: [{name: checkin_id, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/MedicationCheckinUpdate'}}}}
      responses: {'200': {description: Updated checkin, content: {application/json: {schema: {$ref: '#/components/schemas/MedicationCheckin'}}}}, '401': {$ref: '#/components/responses/Problem'}, '404': {$ref: '#/components/responses/Problem'}, '409': {$ref: '#/components/responses/Problem'}, '422': {$ref: '#/components/responses/Problem'}}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 8, maxLength: 128}
    UploadId:
      name: upload_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    RecordId:
      name: record_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    RecordType:
      name: record_type
      in: path
      required: true
      schema:
        type: string
        enum: [diet-records, stool-records, symptom-records]
  responses:
    Problem:
      description: RFC 9457 Problem Details
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    RecordVersionConflict:
      description: 提交的 profile_version 已过期；重新 GET 后再应用 PATCH。
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
          example:
            type: https://gutcare.invalid/problems/record_version_conflict
            title: Patient profile has changed
            status: 409
            detail: Reload the profile and retry your update.
            instance: /api/v1/patients/me
            code: RECORD_VERSION_CONFLICT
            request_id: 019a0000-0000-7000-8000-000000000099
  schemas:
    MedicationPlanCreate:
      type: object
      additionalProperties: false
      required: [medication_name, source_type]
      properties:
        medication_name: {type: string, minLength: 1, maxLength: 160}
        dosage_text: {type: [string, 'null'], maxLength: 160, description: 按来源原文保存，不推断剂量}
        route_code: {type: [string, 'null'], maxLength: 32}
        start_date: {type: [string, 'null'], format: date}
        end_date: {type: [string, 'null'], format: date}
        source_type: {type: string, enum: [manual, medical_document]}
        source_document_id: {type: [string, 'null'], format: uuid, description: 仅允许同患者医疗档案}
    MedicationPlanPatch:
      type: object
      additionalProperties: false
      required: [record_version]
      properties:
        record_version: {type: integer, minimum: 1}
        medication_name: {type: string, minLength: 1, maxLength: 160}
        dosage_text: {type: [string, 'null'], maxLength: 160}
        route_code: {type: [string, 'null'], maxLength: 32}
        start_date: {type: [string, 'null'], format: date}
        end_date: {type: [string, 'null'], format: date}
        confirmation_status: {type: string, enum: [confirmed, needs_review]}
    MedicationPlanTransition:
      type: object
      additionalProperties: false
      required: [record_version, action]
      properties:
        record_version: {type: integer, minimum: 1}
        action: {type: string, enum: [confirm, review, activate, end, discontinue]}
    MedicationPlan:
      type: object
      required: [id, patient_id, medication_name, source_type, source_deleted, confirmation_status, plan_status, record_version]
      properties:
        id: {type: string, format: uuid}
        patient_id: {type: string, format: uuid, readOnly: true}
        medication_name: {type: string}
        dosage_text: {type: [string, 'null']}
        route_code: {type: [string, 'null']}
        start_date: {type: [string, 'null'], format: date}
        end_date: {type: [string, 'null'], format: date}
        source_type: {type: string, enum: [manual, medical_document]}
        source_document_id: {type: [string, 'null'], format: uuid}
        source_deleted: {type: boolean, description: True when the source document has been deleted; no original identifier or metadata is exposed}
        confirmation_status: {type: string, enum: [pending, confirmed, needs_review]}
        plan_status: {type: string, enum: [active, ended, discontinued]}
        record_version: {type: integer}
    MedicationScheduleWrite:
      type: object
      additionalProperties: false
      required: [local_time, timezone, valid_from]
      properties:
        local_time: {type: string, format: time}
        timezone: {type: string, maxLength: 64, description: Server-validated IANA timezone}
        rrule: {type: [string, 'null'], maxLength: 256, description: Restricted RFC5545 subset; DAILY/WEEKLY, INTERVAL, WEEKLY BYDAY, COUNT or UNTIL}
        valid_from: {type: string, format: date}
        valid_to: {type: [string, 'null'], format: date}
        enabled: {type: boolean, default: true}
        record_version: {type: [integer, 'null'], minimum: 1, description: Required on update; omitted on create}
    MedicationSchedule:
      type: object
      required: [id, plan_id, local_time, timezone, valid_from, enabled, record_version]
      properties:
        id: {type: string, format: uuid}
        plan_id: {type: string, format: uuid}
        local_time: {type: string, format: time}
        timezone: {type: string}
        rrule: {type: [string, 'null']}
        valid_from: {type: string, format: date}
        valid_to: {type: [string, 'null'], format: date}
        enabled: {type: boolean}
        record_version: {type: integer}
    MedicationCheckinUpdate:
      type: object
      additionalProperties: false
      required: [record_version, status]
      properties:
        record_version: {type: integer, minimum: 1}
        status: {type: string, enum: [taken, not_taken, pending, skipped]}
        taken_at: {type: [string, 'null'], format: date-time, description: Required with taken}
        note: {type: [string, 'null'], maxLength: 500}
    MedicationCheckin:
      type: object
      required: [id, schedule_id, local_date, scheduled_for, status, record_version]
      properties:
        id: {type: string, format: uuid}
        schedule_id: {type: string, format: uuid}
        local_date: {type: string, format: date}
        scheduled_for: {type: string, format: date-time}
        status: {type: string, enum: [taken, not_taken, pending, skipped]}
        taken_at: {type: [string, 'null'], format: date-time}
        note: {type: [string, 'null'], maxLength: 500}
        record_version: {type: integer}
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [email, password, birth_year, privacy_policy_version, health_data_processing_consent, health_data_processing_policy_version]
      properties:
        email: {type: string, format: email, maxLength: 254}
        password: {type: string, minLength: 12, maxLength: 128}
        birth_year: {type: integer, minimum: 1900, maximum: 2100}
        privacy_policy_version: {type: string, minLength: 1, maxLength: 32, description: 必须与服务端配置的当前 privacy policy version 一致}
        health_data_processing_consent: {type: boolean, const: true, description: 注册前单独、明确同意健康数据处理}
        health_data_processing_policy_version: {type: string, minLength: 1, maxLength: 32, description: 必须与服务端配置的健康数据处理告知版本一致}
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: {type: string, format: email}
        password: {type: string}
    TokenPair:
      type: object
      required: [access_token, refresh_token, token_type, expires_in]
      properties:
        access_token: {type: string}
        refresh_token: {type: string}
        token_type: {const: Bearer}
        expires_in: {type: integer, minimum: 1}
    PatientProfile:
      type: object
      required: [id, birth_year, timezone, profile_version]
      properties:
        id: {type: string, format: uuid}
        nickname: {type: [string, 'null'], maxLength: 64}
        birth_year: {type: integer, minimum: 1900, maximum: 2100}
        timezone: {type: string}
        profile_version: {type: integer, minimum: 1}
    PatientProfilePatch:
      type: object
      additionalProperties: false
      required: [profile_version]
      description: PATCH 仅应用显式提供的字段；nickname 可显式传 null 清空，其余字段不可为 null。profile_version 必须匹配当前版本；无字段变化时不递增版本。
      properties:
        nickname: {type: [string, 'null'], maxLength: 64}
        birth_year: {type: integer, minimum: 1900, maximum: 2100}
        timezone: {type: string, maxLength: 64}
        profile_version: {type: integer, minimum: 1}
    ConsentDecision:
      type: object
      additionalProperties: false
      required: [consent_type, policy_version, granted]
      description: 每次决定追加授权历史；privacy_policy 仅能通过 account-deletion 撤回，不接受通用决定。服务端按 consent_type 验证配置的当前 policy_version 并绑定独立告知摘要哈希，不接受客户端传入摘要。granted=false 表示拒绝或撤回。
      properties:
        consent_type: {type: string, enum: [health_data_processing, mood_data_processing, mood_ai_sharing, sensitive_image, third_party_ai, push_notification]}
        policy_version: {type: string, minLength: 1, maxLength: 32}
        granted: {type: boolean}
        decided_at: {type: string, format: date-time, readOnly: true}
    UploadSession:
      type: object
      required: [upload_id, upload_url, expires_at]
      properties:
        upload_id: {type: string, format: uuid}
        upload_url: {type: string, format: uri, pattern: '^https://[^/]+/uploads/'}
        form_fields: {type: object, additionalProperties: {type: string}}
        expires_at: {type: string, format: date-time}
    FileObject:
      type: object
      required: [id, storage_status, content_type, size_bytes]
      properties:
        id: {type: string, format: uuid}
        storage_status: {type: string, enum: [uploading, available, deleting, deleted, failed]}
        content_type: {type: string}
        size_bytes: {type: integer}
    MedicalDocumentCreate:
      type: object
      additionalProperties: false
      required: [file_object_id, document_type, processing_mode]
      properties:
        file_object_id: {type: string, format: uuid}
        document_type: {type: string, enum: [outpatient_record, discharge_summary, diagnosis_certificate, lab_report, prescription, other]}
        hospital_name: {type: [string, 'null'], maxLength: 160}
        document_date: {type: [string, 'null'], format: date, description: 与旧功能字段 visit_date 对应}
        notes: {type: [string, 'null'], maxLength: 1000}
        processing_mode: {type: string, enum: [store_only, analyze]}
    MedicalDocumentPatch:
      type: object
      additionalProperties: false
      required: [record_version]
      description: PATCH 不允许更新 file_object_id 或 processing_mode；未提供字段保持原值，显式 null 清空可空字段。
      properties:
        record_version: {type: integer, minimum: 1}
        document_type: {type: string, enum: [outpatient_record, discharge_summary, diagnosis_certificate, lab_report, prescription, other]}
        hospital_name: {type: [string, 'null'], maxLength: 160}
        document_date: {type: [string, 'null'], format: date}
        notes: {type: [string, 'null'], maxLength: 1000}
    MedicalDocument:
      type: object
      required: [id, file_object_id, document_type, document_date, notes, processing_mode, parse_status, parse_outcome, parse_reason_code, record_version, created_at, updated_at, file_status, original_name]
      properties:
        id: {type: string, format: uuid}
        file_object_id: {type: string, format: uuid}
        document_type: {type: string, enum: [outpatient_record, discharge_summary, diagnosis_certificate, lab_report, prescription, other]}
        hospital_name: {type: [string, 'null']}
        document_date: {type: [string, 'null'], format: date}
        notes: {type: [string, 'null'], maxLength: 1000}
        processing_mode: {type: string, enum: [store_only, analyze]}
        parse_status: {type: string, enum: [not_requested, pending, processing, needs_confirmation, confirmed, failed]}
        parse_outcome: {type: [string, 'null'], enum: [extracted, no_supported_facts, insufficient_quality, null], description: Additive parse result classification; lifecycle status remains parse_status.}
        parse_reason_code: {type: [string, 'null'], enum: [no_supported_fields, unsupported_content, low_quality_scan, illegible_content, incomplete_document, null]}
        record_version: {type: integer, minimum: 1}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        file_status: {type: string, enum: [available, deleting]}
        original_name: {type: string}
    MedicalFactConflict:
      type: object
      required: [id, status, record_version, created_at]
      properties:
        id: {type: string, format: uuid}
        status: {type: string, enum: [open, resolved, invalidated]}
        record_version: {type: integer, minimum: 1}
        created_at: {type: string, format: date-time}
        resolution: {type: [string, 'null'], enum: [keep_both, null]}
        members:
          type: [array, 'null']
          items: {type: object, required: [fact_id, source_document_id, field_code, value, sampled_on], properties: {fact_id: {type: string, format: uuid}, source_document_id: {type: string, format: uuid}, field_code: {type: string, enum: [test_item, test_result]}, value: {}, unit: {type: [string, 'null']}, sampled_on: {type: string, format: date}}}
    MedicalFactConflictResolution:
      type: object
      required: [id, status, record_version, resolution]
      properties:
        id: {type: string, format: uuid}
        status: {const: resolved}
        record_version: {type: integer, minimum: 1}
        resolution: {const: keep_both}
    MedicalCandidateDecision:
      type: object
      additionalProperties: false
      required: [decision, record_version]
      properties:
        decision: {type: string, enum: [accept, correct, reject]}
        record_version: {type: integer, minimum: 1}
        value: {}
    MedicalFieldCandidate:
      type: object
      additionalProperties: false
      required: [id, field_code, value_type, value, unit, confidence, uncertainty, source_locator, excerpt, review_status, record_version, chosen_value]
      properties:
        id: {type: string, format: uuid}
        field_code: {type: string, enum: [diagnosis, document_date, recommendation, test_item, test_result, medication_name, medication_dose, medication_frequency, medication_duration, allergy]}
        value_type: {type: string, enum: [diagnosis, date, string, object]}
        value: {description: For test_result, an object with result, optional controlled unit and optional sampled_on ISO date; object value_type is limited to test_result and medication_dose.}
        unit: {type: [string, 'null'], maxLength: 32}
        confidence: {type: [number, 'null'], minimum: 0, maximum: 1}
        uncertainty: {type: [string, 'null'], maxLength: 500}
        source_locator: {type: [object, 'null']}
        excerpt: {type: [string, 'null'], maxLength: 500}
        review_status: {type: string, enum: [pending, accepted, corrected, rejected, invalidated]}
        record_version: {type: integer, minimum: 1}
        chosen_value: {}
    MedicalDocumentPage:
      type: object
      required: [items, next_cursor]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/MedicalDocument'}}
        next_cursor: {type: [string, 'null']}
    DownloadGrant:
      type: object
      required: [download_url, expires_at]
      properties:
        download_url: {type: string, format: uri, pattern: '^https://[^/]+/uploads/'}
        expires_at: {type: string, format: date-time}
    RecordWrite:
      type: object
      additionalProperties: false
      required: [occurred_at, payload]
      description: >-
        路径 record_type 是 payload 的判别字段：diet-records 使用 DietRecordPayload，stool-records 使用 StoolRecordPayload，symptom-records 使用 SymptomRecordPayload。未知字段、其他记录类型字段和客户端指定 patient_id/source_type/确认状态均拒绝。创建必须带 Idempotency-Key。
      properties:
        occurred_at: {type: string, format: date-time}
        payload:
          anyOf:
            - {$ref: '#/components/schemas/DietRecordPayload'}
            - {$ref: '#/components/schemas/StoolRecordPayload'}
            - {$ref: '#/components/schemas/SymptomRecordPayload'}
          description: 根据 URL 中的 record_type 选择一个严格 DTO；服务端拒绝不匹配的字段。
    RecordPatch:
      type: object
      additionalProperties: false
      required: [record_version, occurred_at, payload]
      properties:
        record_version: {type: integer, minimum: 1}
        occurred_at: {type: string, format: date-time}
        payload: {$ref: '#/components/schemas/RecordWrite/properties/payload'}
    DietRecordPayload:
      type: object
      additionalProperties: false
      properties:
        meal_type: {type: [string, 'null'], enum: [breakfast, lunch, dinner, snack, other, null]}
        image_object_id: {type: [string, 'null'], format: uuid, description: 可选的已完成且通过扫描的 F02 diet_image 文件对象；需同患者且有当前数据处理及敏感图片授权}
        text_description: {type: [string, 'null'], maxLength: 4000}
        items:
          type: array
          maxItems: 50
          items:
            type: object
            additionalProperties: false
            required: [name]
            properties:
              name: {type: string, minLength: 1, maxLength: 160}
              category_code: {type: [string, 'null'], maxLength: 64}
              amount_text: {type: [string, 'null'], maxLength: 160}
        portion_note: {type: [string, 'null'], maxLength: 160}
        cooking_method: {type: [string, 'null'], maxLength: 160}
        subjective_note: {type: [string, 'null'], maxLength: 1000}
    StoolRecordPayload:
      type: object
      additionalProperties: false
      properties:
        bristol_type: {type: [integer, 'null'], minimum: 1, maximum: 7}
        image_object_id: {type: [string, 'null'], format: uuid, description: 可选的已完成且通过扫描的 F02 stool_image 文件对象；需同患者且有当前数据处理及敏感图片授权}
        color_code: {type: [string, 'null'], maxLength: 32}
        blood_reported: {type: [boolean, 'null'], description: 患者自述，不代表图像诊断}
        urgency_level: {type: [integer, 'null'], minimum: 0, maximum: 10}
        bowel_amount: {type: [string, 'null'], maxLength: 32}
        process_sensation: {type: array, maxItems: 20, items: {type: string, maxLength: 48}}
        notes: {type: [string, 'null'], maxLength: 1000}
    SymptomRecordPayload:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 30
          items:
            type: object
            additionalProperties: false
            required: [symptom_code]
            properties:
              symptom_code: {type: string, enum: [abdominal_pain, bloating, diarrhea, constipation, nausea, vomiting, acid_reflux, appetite_change, blood_in_stool_concern, other]}
              other_description: {type: [string, 'null'], minLength: 1, maxLength: 160, description: symptom_code=other 时必填，其他类别禁止填写}
              severity: {type: [integer, 'null'], minimum: 0, maximum: 10, description: 患者主观评分}
              body_location: {type: [string, 'null'], maxLength: 64}
        symptom_status: {type: string, enum: [ongoing, relieved], default: ongoing, description: 仍持续或已缓解；PATCH 变更写入不可变历史}
        duration_minutes: {type: [integer, 'null'], minimum: 0, maximum: 10080}
        notes: {type: [string, 'null'], maxLength: 2000}
        companion_signs: {type: array, maxItems: 30, items: {type: string, maxLength: 48}}
    Record:
      allOf:
        - {$ref: '#/components/schemas/RecordWrite'}
        - type: object
          required: [id, record_version, created_at, updated_at]
          properties:
            id: {type: string, format: uuid}
            record_version: {type: integer, minimum: 1}
            created_at: {type: string, format: date-time}
            updated_at: {type: string, format: date-time}
    RecordPage:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Record'}}
        next_cursor: {type: [string, 'null']}
    RiskAlert:
      type: object
      required: [id, severity, message, recommended_action, status, triggered_at, evidence]
      properties:
        id: {type: string, format: uuid}
        severity: {type: string, enum: [attention, seek_care, emergency]}
        message: {type: string}
        recommended_action: {type: string}
        status: {type: string, enum: [unread, read, reevaluated]}
        triggered_at: {type: string, format: date-time}
        read_at: {type: [string, 'null'], format: date-time}
        reevaluated_at: {type: [string, 'null'], format: date-time}
        evidence: {type: object}
    RiskAlertPage:
      type: object
      required: [items, next_cursor]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/RiskAlert'}}
        next_cursor: {type: [string, 'null']}
    SymptomStatusHistory:
      type: object
      additionalProperties: false
      required: [symptom_record_id, current_status, events]
      properties:
        symptom_record_id: {type: string, format: uuid}
        current_status: {type: string, enum: [ongoing, relieved]}
        events:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [status, record_version, changed_at]
            properties:
              status: {type: string, enum: [ongoing, relieved]}
              record_version: {type: integer, minimum: 1}
              changed_at: {type: string, format: date-time}
    AnalysisTaskRequest:
      type: object
      additionalProperties: false
      required: [analysis_type]
      properties:
        analysis_type: {type: string, enum: [comprehensive_health_analysis, periodic_summary]}
        requested_from: {type: [string, 'null'], format: date-time}
        requested_to: {type: [string, 'null'], format: date-time}
    AnalysisTaskPreview:
      type: object
      additionalProperties: false
      required: [analysis_type, requested_from, requested_to, timezone, mood_record_count_in_range, mood_record_count_eligible, mood_record_count_excluded_by_consent, mood_exclusion_reasons]
      description: 当前时点的只读预览；不构成任务输入保证。POST 创建时会重新校验并冻结实际输入。
      properties:
        analysis_type: {type: string, enum: [comprehensive_health_analysis, periodic_summary]}
        requested_from: {type: [string, 'null'], format: date-time}
        requested_to: {type: [string, 'null'], format: date-time}
        timezone: {type: string, minLength: 1, maxLength: 64, description: 患者配置的 IANA 时区，应用于默认/显式范围的 bucket 语义。}
        mood_record_count_in_range: {type: integer, minimum: 0, description: 当前患者在范围内的未删除心情记录数。}
        mood_record_count_eligible: {type: integer, minimum: 0, description: 当前同时满足 health_data_processing、mood_data_processing、mood_ai_sharing、third_party_ai 的心情记录数；创建事务将再次计算。}
        mood_record_count_excluded_by_consent: {type: integer, minimum: 0, description: 范围内但因 mood 专项授权缺失而未达到 mood eligible 的记录数。}
        mood_exclusion_reasons:
          type: array
          uniqueItems: true
          items: {type: string, enum: [mood_data_processing_missing, mood_ai_sharing_missing]}
    TrendResponse:
      type: object
      additionalProperties: false
      required: [timezone, from, to, bucket, activity, stool, symptom, diet_confirmed_categories, medication_checkins, mood]
      properties:
        timezone: {type: string}
        from: {type: string, format: date-time}
        to: {type: string, format: date-time}
        bucket: {type: string, enum: [day, week]}
        activity: {type: object}
        stool: {type: object}
        symptom: {type: object}
        diet_confirmed_categories: {type: object}
        medication_checkins: {type: object}
        mood:
          oneOf:
            - {$ref: '#/components/schemas/MoodTrendAvailable'}
            - {$ref: '#/components/schemas/MoodTrendUnavailable'}
          discriminator:
            propertyName: availability
            mapping:
              available: '#/components/schemas/MoodTrendAvailable'
              consent_required: '#/components/schemas/MoodTrendUnavailable'
    MoodTrendAvailable:
      type: object
      additionalProperties: false
      required: [availability, buckets]
      properties:
        availability: {type: string, const: available}
        buckets: {type: array, items: {$ref: '#/components/schemas/MoodTrendBucket'}, description: Empty means authorization is valid but no mood records exist in the requested range.}
    MoodTrendUnavailable:
      type: object
      additionalProperties: false
      required: [availability, reason_code, missing_consents]
      properties:
        availability: {type: string, const: consent_required}
        reason_code: {type: string, const: CONSENT_REQUIRED}
        missing_consents:
          type: array
          uniqueItems: true
          minItems: 1
          maxItems: 2
          items: {type: string, enum: [health_data_processing, mood_data_processing]}
    MoodTrendBucket:
      type: object
      additionalProperties: false
      required: [period_start, period_end, has_data, record_count, mood_level_counts]
      description: Patient-reported mood level counts for one patient-timezone day/week bucket. record_count equals the sum of mood_level_counts; has_data is true iff record_count is greater than zero. No note, emotion tags, diagnosis, or causal inference.
      properties:
        period_start: {type: string, format: date}
        period_end: {type: string, format: date, description: Exclusive end date in the patient's timezone.}
        has_data: {type: boolean}
        record_count: {type: integer, minimum: 0}
        mood_level_counts:
          type: object
          additionalProperties: false
          required: ['1', '2', '3', '4', '5']
          properties:
            '1': {type: integer, minimum: 0}
            '2': {type: integer, minimum: 0}
            '3': {type: integer, minimum: 0}
            '4': {type: integer, minimum: 0}
            '5': {type: integer, minimum: 0}
    AnalysisTask:
      type: object
      additionalProperties: false
      required: [id, analysis_type, status, input_summary, created_at, updated_at, attempt, retry_of, result, error_code]
      properties:
        id: {type: string, format: uuid}
        analysis_type: {type: string, enum: [comprehensive_health_analysis, periodic_summary]}
        status: {type: string, enum: [pending, processing, needs_input, succeeded, partial, failed, cancelled]}
        input_summary:
          type: object
          additionalProperties: false
          required: [included_mood_record_count]
          description: 任务创建时不可变快照实际纳入的数据计数。可从该任务持久化快照事实派生并持久化；绝不能按当前记录或当前授权重算历史值。升级前任务由不可变快照回填，快照中无 mood 时为 0。
          properties:
            included_mood_record_count: {type: integer, minimum: 0}
        attempt: {type: integer, minimum: 1}
        retry_of: {type: [string, 'null'], format: uuid}
        result: {oneOf: [{$ref: '#/components/schemas/AnalysisResult'}, {type: 'null'}]}
        error_code: {type: [string, 'null'], pattern: '^[A-Z0-9_]+$'}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    AdviceEvidence:
      oneOf:
        - type: object
          additionalProperties: false
          required: [evidence_type, source_type, source_id, source_version, locator, source_deleted, target]
          properties:
            evidence_type: {const: patient}
            source_type: {type: string, enum: [confirmed_medical_fact, diet_record, stool_record, symptom_record, mood_record, medication_plan, medication_checkin, risk_alert]}
            source_id: {type: string, format: uuid}
            source_version: {type: integer, minimum: 1}
            locator: {type: [string, 'null'], maxLength: 160}
            source_deleted: {type: boolean}
            target: {type: [object, 'null'], additionalProperties: false, required: [type, id], properties: {type: {type: string}, id: {type: string, format: uuid}}}
        - type: object
          additionalProperties: false
          required: [evidence_type, knowledge_ref, knowledge_version, title, publisher, citation_url]
          properties:
            evidence_type: {const: knowledge}
            knowledge_ref: {type: string, minLength: 1, maxLength: 160}
            knowledge_version: {type: string, minLength: 1, maxLength: 64}
            title: {type: string, minLength: 1, maxLength: 240}
            publisher: {type: string, minLength: 1, maxLength: 160}
            citation_url: {type: [string, 'null'], format: uri, pattern: '^https://'}
    Advice:
      type: object
      additionalProperties: false
      required: [id, task_id, category, priority, title, body, uncertainty, applicability, safety_boundary, version, status, basis_updated, basis_updated_at, basis_update_reason, evidence, feedback, feedback_history, created_at]
      properties:
        id: {type: string, format: uuid}
        task_id: {type: string, format: uuid}
        category: {type: string, enum: [diet, lifestyle, record_management, medication_adherence, care_consultation]}
        priority: {type: string, enum: [routine, important]}
        title: {type: string, minLength: 1, maxLength: 160}
        body: {type: string, minLength: 1, maxLength: 3000}
        uncertainty: {type: object, additionalProperties: false, required: [level, reasons], properties: {level: {type: string, enum: [low, moderate, high]}, reasons: {type: array, maxItems: 10, items: {type: string, maxLength: 240}}}}
        applicability: {type: object, additionalProperties: false, required: [scope, limitations], properties: {scope: {type: string, enum: [general, condition_specific]}, limitations: {type: array, maxItems: 10, items: {type: string, maxLength: 240}}}}
        safety_boundary: {type: object, additionalProperties: false, required: [not_diagnosis, not_prescription, risk_alert_priority], properties: {not_diagnosis: {const: true}, not_prescription: {const: true}, risk_alert_priority: {const: true}}}
        version: {type: string, minLength: 1, maxLength: 32}
        status: {type: string, enum: [new, read, archived]}
        basis_updated: {type: boolean}
        basis_updated_at: {type: [string, 'null'], format: date-time}
        basis_update_reason: {type: [string, 'null'], enum: [source_updated, source_deleted, fact_replaced, null]}
        evidence: {type: array, items: {$ref: '#/components/schemas/AdviceEvidence'}}
        feedback: {oneOf: [{$ref: '#/components/schemas/AdviceFeedback'}, {type: 'null'}]}
        feedback_history: {type: array, items: {type: object, additionalProperties: false, required: [feedback_type, version, created_at], properties: {feedback_type: {type: string, enum: [helpful, not_helpful, not_applicable]}, version: {type: integer, minimum: 1}, created_at: {type: string, format: date-time}}}}
        created_at: {type: string, format: date-time}
    AdvicePage:
      type: object
      required: [items, next_cursor]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Advice'}}
        next_cursor: {type: [string, 'null']}
    AdviceFeedbackRequest:
      type: object
      additionalProperties: false
      required: [feedback_type, expected_version]
      properties:
        feedback_type: {type: string, enum: [helpful, not_helpful, not_applicable]}
        expected_version: {type: integer, minimum: 0}
    AdviceFeedback:
      type: object
      additionalProperties: false
      required: [advice_id, feedback_type, version]
      properties:
        advice_id: {type: string, format: uuid}
        feedback_type: {type: string, enum: [helpful, not_helpful, not_applicable]}
        version: {type: integer, minimum: 1}
    AnalysisResult:
      type: object
      additionalProperties: false
      required: [schema_version, summary, observations, evidence, uncertainties, missing_data]
      properties:
        schema_version: {const: '1.0'}
        summary: {type: string, maxLength: 1200}
        observations: {type: array, maxItems: 30, items: {type: string, maxLength: 500}}
        evidence:
          type: array
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required: [source_type, source_id, source_version, locator, source_deleted]
            properties:
              source_type: {type: string, enum: [confirmed_medical_fact, diet_record, stool_record, symptom_record, mood_record, medication_plan, medication_checkin, risk_alert]}
              source_id: {type: string, format: uuid}
              source_version: {type: integer, minimum: 1}
              locator: {type: [string, 'null'], maxLength: 160}
              source_deleted: {type: boolean}
        uncertainties: {type: array, maxItems: 30, items: {type: string, maxLength: 500}}
        missing_data: {type: array, maxItems: 30, items: {type: string, maxLength: 120}}
    AcceptedOperation:
      type: object
      required: [operation_id, status]
      properties:
        operation_id: {type: string, format: uuid}
        status: {const: accepted}
    PrivacyDeletionAccepted:
      type: object
      additionalProperties: false
      required: [operation_id, receipt, status]
      properties:
        operation_id: {type: string, format: uuid}
        receipt: {type: [string, 'null'], minLength: 40, maxLength: 128, description: Present only in the response that creates the operation.}
        status: {const: accepted}
    PrivacyDeletionStatus:
      type: object
      additionalProperties: false
      required: [operation_id, status, requested_at, due_at, completed_at]
      properties:
        operation_id: {type: string, format: uuid}
        status: {type: string, enum: [pending, processing, overdue, dead_letter, completed]}
        requested_at: {type: string, format: date-time}
        due_at: {type: string, format: date-time}
        completed_at: {type: [string, 'null'], format: date-time}
    PatientNotification:
      type: object
      additionalProperties: false
      required: [id, event_type, category, priority, occurred_at, created_at, read_at, target, target_unavailable]
      properties:
        id: {type: string, format: uuid}
        event_type: {type: string, enum: [analysis_completed, advice_created, risk_alert_created, checkin_reminder]}
        category: {type: string, enum: [analysis, advice, risk, medication_reminder]}
        priority: {type: string, enum: [ordinary, risk]}
        occurred_at: {type: string, format: date-time}
        created_at: {type: string, format: date-time}
        read_at: {type: [string, 'null'], format: date-time}
        target: {type: [object, 'null'], additionalProperties: false, required: [type, id], properties: {type: {type: string, enum: [analysis_task, advice, risk_alert, medication_checkin]}, id: {type: string, format: uuid}}}
        target_unavailable: {type: boolean}
    NotificationPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/PatientNotification'}}
        next_cursor: {type: [string, 'null']}
    NotificationPreference:
      type: object
      additionalProperties: false
      required: [ordinary_in_app_enabled, quiet_start, quiet_end, timezone]
      properties:
        ordinary_in_app_enabled: {type: boolean}
        quiet_start: {type: [string, 'null'], format: time}
        quiet_end: {type: [string, 'null'], format: time}
        timezone: {type: string, minLength: 1, maxLength: 64, description: IANA 时区}
    ActivityWrite:
      type: object
      additionalProperties: false
      required: [activity_type, intensity, subjective_feeling, duration_minutes, occurred_at]
      properties:
        activity_type: {type: string, enum: [walking, jogging, cycling, other]}
        description: {type: [string, 'null'], minLength: 1, maxLength: 160, description: other 必填且其他类型禁止}
        intensity: {type: string, enum: [low, moderate, high]}
        subjective_feeling: {type: string, enum: [better, same, worse]}
        duration_minutes: {type: integer, minimum: 1, maximum: 1440}
        occurred_at: {type: string, format: date-time, description: 活动开始时间，必须包含时区}
    ActivityPatch:
      type: object
      additionalProperties: false
      required: [record_version]
      properties:
        record_version: {type: integer, minimum: 1}
        activity_type: {type: string, enum: [walking, jogging, cycling, other]}
        description: {type: [string, 'null'], minLength: 1, maxLength: 160}
        intensity: {type: string, enum: [low, moderate, high]}
        subjective_feeling: {type: string, enum: [better, same, worse]}
        duration_minutes: {type: integer, minimum: 1, maximum: 1440}
        occurred_at: {type: string, format: date-time}
    ActivityRecord:
      allOf:
        - {$ref: '#/components/schemas/ActivityWrite'}
        - {type: object, required: [id, record_version, created_at, updated_at], properties: {id: {type: string, format: uuid}, record_version: {type: integer, minimum: 1}, created_at: {type: string, format: date-time}, updated_at: {type: string, format: date-time}}}
    ActivityPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties: {items: {type: array, items: {$ref: '#/components/schemas/ActivityRecord'}}, next_cursor: {type: [string, 'null']}}
    MoodWrite:
      type: object
      additionalProperties: false
      required: [occurred_at, mood_level]
      properties:
        occurred_at: {type: string, format: date-time, description: Patient reported event time; timezone required.}
        mood_level: {type: integer, minimum: 1, maximum: 5, description: Subjective self-rating only; not a clinical scale.}
        emotion_tags:
          type: array
          maxItems: 5
          uniqueItems: true
          default: []
          items: {type: string, enum: [calm, content, joyful, sad, anxious, irritable, overwhelmed, tired, other]}
        note: {type: [string, 'null'], maxLength: 500, description: High sensitivity free text; never included in agent inputs, logs, notifications, risk rules or trends.}
    MoodPatch:
      type: object
      additionalProperties: false
      required: [record_version]
      properties:
        record_version: {type: integer, minimum: 1}
        occurred_at: {type: string, format: date-time}
        mood_level: {type: integer, minimum: 1, maximum: 5}
        emotion_tags:
          type: array
          maxItems: 5
          uniqueItems: true
          items: {type: string, enum: [calm, content, joyful, sad, anxious, irritable, overwhelmed, tired, other]}
        note: {type: [string, 'null'], maxLength: 500}
    MoodSummary:
      type: object
      additionalProperties: false
      required: [id, occurred_at, mood_level, emotion_tags, record_version, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        occurred_at: {type: string, format: date-time}
        mood_level: {type: integer, minimum: 1, maximum: 5}
        emotion_tags: {type: array, maxItems: 5, uniqueItems: true, items: {type: string, enum: [calm, content, joyful, sad, anxious, irritable, overwhelmed, tired, other]}}
        record_version: {type: integer, minimum: 1}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    MoodDetail:
      type: object
      additionalProperties: false
      required: [id, occurred_at, mood_level, emotion_tags, record_version, created_at, updated_at, note]
      properties:
        id: {type: string, format: uuid}
        occurred_at: {type: string, format: date-time}
        mood_level: {type: integer, minimum: 1, maximum: 5}
        emotion_tags: {type: array, maxItems: 5, uniqueItems: true, items: {type: string, enum: [calm, content, joyful, sad, anxious, irritable, overwhelmed, tired, other]}}
        record_version: {type: integer, minimum: 1}
