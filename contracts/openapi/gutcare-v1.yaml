                purpose: {type: string, enum: [medical_document, diet_image, stool_image, avatar]}
                file_name: {type: string, maxLength: 255}
                content_type: {type: string}
                size_bytes: {type: integer, minimum: 1}
      responses:
        '201':
          description: 使用返回的同源 gateway URL 上传
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UploadSession'}
        '401': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '413': {$ref: '#/components/responses/Problem'}
        '415': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /files/uploads/{upload_id}/complete:
    post:
      summary: 完成并校验文件上传
      tags: [Records]
      operationId: completeUpload
      parameters:
        - {$ref: '#/components/parameters/UploadId'}
      responses:
        '200':
          description: 文件已校验可用
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FileObject'}
        '409': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '413': {$ref: '#/components/responses/Problem'}
        '415': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /medical-documents:
    get:
      summary: 分页获取当前患者医疗档案
      tags: [Records]
      operationId: listMedicalDocuments
      parameters:
        - {name: cursor, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
        - {name: document_type, in: query, schema: {type: string, enum: [outpatient_record, discharge_summary, diagnosis_certificate, lab_report, prescription, other]}}
      responses:
        '200':
          description: 医疗档案分页
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MedicalDocumentPage'}
        '401': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
    post:
      summary: 创建医疗档案；analyze 需健康数据与第三方 AI 两项当前授权，store_only 仅需健康数据授权
      tags: [Records]
      operationId: createMedicalDocument
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MedicalDocumentCreate'}
      responses:
        '201':
          description: 已创建；analyze 模式仅记录待处理状态并创建解析请求
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MedicalDocument'}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}

        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /uploads/{capability}:
    servers:
      - url: https://api.example.invalid
        description: Gateway root; capability paths are not prefixed with /api/v1.
    parameters:
      - {name: capability, in: path, required: true, schema: {type: string, minLength: 32, maxLength: 128}}
    put:
      summary: 通过同源 HTTPS gateway 上传原始文件
      description: 仅接收 API 创建的 opaque capability；必须附 Bearer access token；不接受 bucket 或 object key。
      tags: [Records]
      operationId: uploadThroughGateway
      requestBody:
        required: true
        content:
          application/pdf:
            schema: {type: string, format: binary, maxLength: 20971520}
          image/jpeg:
            schema: {type: string, format: binary, maxLength: 10485760}
          image/png:
            schema: {type: string, format: binary, maxLength: 10485760}
      responses:
        '204': {description: 已安全写入私有临时对象，等待 complete 校验/扫描}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
    get:
      summary: 下载短期只读授权对应的私有对象
      description: 下载 capability 为 bearer secret；仅通过短期 download grant 获得，禁止在日志中记录。
      tags: [Records]
      operationId: downloadThroughGateway
      security: []
      responses:
        '200':
          description: 私有文件流，设置 private, no-store
          content:
            application/pdf: {schema: {type: string, format: binary}}
            image/jpeg: {schema: {type: string, format: binary}}
            image/png: {schema: {type: string, format: binary}}
        '404': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /symptom-records/{record_id}/status-history:
