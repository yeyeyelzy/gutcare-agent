  /analysis-tasks:
    post:
      summary: 创建异步分析任务
      tags: [Analysis]
      operationId: createAnalysisTask
      security: [{BearerAuth: []}]
      description: 分析范围统一使用 UTC 半开区间 [requested_from, requested_to)。periodic_summary 必须同时提供两端；comprehensive_health_analysis 可同时省略两端表示不限定时间，或同时提供两端。任一类型只提供单端均返回 RFC 9457 422，不存在隐含默认边界。与预览采用相同范围校验。同一患者同幂等键及同请求摘要重放原始响应；输入仅由当前授权的已确认数据冻结生成，不含报告正文或对象 URL。
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AnalysisTaskRequest'}
      responses:
        '202':
          description: 异步任务及不可变输入快照已创建
          headers:
            Location: {description: 新建任务资源地址, schema: {type: string, format: uri-reference}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AnalysisTask'}
              examples:
                accepted:
                  value: {id: '019a0000-0000-7000-8000-000000000801', analysis_type: comprehensive_health_analysis, status: pending, input_summary: {included_mood_record_count: 0}, created_at: '2026-10-01T00:00:00Z', updated_at: '2026-10-01T00:00:00Z', attempt: 1, retry_of: null, result: null, error_code: null}
        '401': {$ref: '#/components/responses/AnalysisTaskAuthProblem'}
        '404': {$ref: '#/components/responses/AnalysisTaskNotFoundProblem'}
        '409': {$ref: '#/components/responses/AnalysisTaskConflictProblem'}
        '422': {$ref: '#/components/responses/AnalysisTaskValidationProblem'}
        '500': {$ref: '#/components/responses/AnalysisTaskInternalProblem'}
    get:
      summary: 列出当前患者分析任务
      tags: [Analysis]
      operationId: listAnalysisTasks
      security: [{BearerAuth: []}]
      parameters:
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
        - {name: cursor, in: query, schema: {type: string, minLength: 1, maxLength: 512}, description: HMAC签名的稳定created_at/id降序游标；绑定当前患者与limit。}
      responses:
        '200':
          description: 患者任务分页
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AnalysisTaskPage'}
              examples:
                first_page:
                  value: {items: [{id: '019a0000-0000-7000-8000-000000000801', analysis_type: comprehensive_health_analysis, status: pending, input_summary: {included_mood_record_count: 0}, created_at: '2026-10-01T00:00:00Z', updated_at: '2026-10-01T00:00:00Z', attempt: 1, retry_of: null, result: null, error_code: null}], next_cursor: null}
        '400': {$ref: '#/components/responses/AnalysisTaskCursorProblem'}
        '401': {$ref: '#/components/responses/AnalysisTaskAuthProblem'}
        '404': {$ref: '#/components/responses/AnalysisTaskNotFoundProblem'}
        '422': {$ref: '#/components/responses/AnalysisTaskValidationProblem'}
        '500': {$ref: '#/components/responses/AnalysisTaskInternalProblem'}
  /analysis-tasks/preview:
    get:
      summary: 预览综合分析范围内的心情记录计数
      tags: [Analysis]
      operationId: previewAnalysisTask
      security: [{BearerAuth: []}]
      description: 返回当前患者指定分析类型/时间范围内的 mood 计数，仅为创建前预览建议。requested_from/to 表示 UTC 时间戳的半开区间 [from,to)。periodic_summary 必须同时提供两端；comprehensive_health_analysis 可同时省略两端（表示不限定时间）或同时提供两端。只提供一端均返回 RFC 9457 422，不存在隐含默认边界。响应回显规范化后的范围。范围内计数统计本人未删除记录；计入预览 eligible 的 mood 还需 health_data_processing、mood_data_processing、mood_ai_sharing、third_party_ai 四项授权全部有效。缺失 mood 专项授权只排除 mood，不改变其他符合条件输入。health_data_processing 或 third_party_ai 是现行 F08 整体任务的基础授权；缺少任一项时按既有 F08 授权错误拒绝预览。预览与创建之间记录/授权可能变化，POST /analysis-tasks 必须在同一创建事务和患者 consent fence 内重新计算并冻结实际输入；本响应不保证与后续任务快照计数相同。
      parameters:
        - {name: analysis_type, in: query, required: true, schema: {type: string, enum: [comprehensive_health_analysis, periodic_summary]}}
        - {name: requested_from, in: query, schema: {type: string, format: date-time}, description: UTC inclusive start; provide with requested_to, or omit both only for comprehensive_health_analysis.}
        - {name: requested_to, in: query, schema: {type: string, format: date-time}, description: UTC exclusive end; provide with requested_from, or omit both only for comprehensive_health_analysis.}
      responses:
        '200':
          description: 当前范围的心情输入预览；不构成最终冻结快照
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AnalysisTaskPreview'}
              examples:
                mood_preview:
                  value: {analysis_type: periodic_summary, requested_from: '2026-10-01T00:00:00Z', requested_to: '2026-10-08T00:00:00Z', timezone: Asia/Shanghai, mood_record_count_in_range: 3, mood_record_count_eligible: 2, mood_record_count_excluded_by_consent: 1, mood_exclusion_reasons: [mood_ai_sharing_missing]}
        '401': {$ref: '#/components/responses/AnalysisTaskAuthProblem'}
        '404': {$ref: '#/components/responses/AnalysisTaskNotFoundProblem'}
        '409': {$ref: '#/components/responses/AnalysisTaskConflictProblem'}
        '422': {$ref: '#/components/responses/AnalysisTaskValidationProblem'}
        '500': {$ref: '#/components/responses/AnalysisTaskInternalProblem'}
