openapi: 3.1.0
info:
  title: GutCare Business API
  version: 1.0.0
  description: APP 与业务后端的冻结 V1 契约；成功直接返回 DTO，错误为 RFC 9457。
  license: {name: Proprietary, identifier: LicenseRef-Proprietary}
servers:
  - url: https://api.example.invalid/api/v1
security:
  - bearerAuth: []
tags:
  - {name: Auth, description: 邮箱账户、会话与密码流程}
  - {name: Profile, description: 当前患者最小资料}
  - {name: Records, description: 文件与健康记录}
  - {name: Risk Alerts, description: 确定性规则风险提示；已读不表示解除}
  - {name: Analysis, description: 异步智能分析任务}
  - {name: Advice, description: 独立于 F08 结果的患者建议及证据}
  - {name: Notifications, description: 不含正文的 P0 站内通知；不包含外部 push}
  - {name: Privacy, description: 授权与数据主体权利}
paths:
  /notifications:
    get:
      summary: 游标分页读取本人站内通知
      tags: [Notifications]
      operationId: listNotifications
      parameters:
        - {name: cursor, in: query, schema: {type: string, maxLength: 128}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
        - {name: category, in: query, schema: {type: string, enum: [analysis, advice, risk, medication_reminder]}}
        - {name: unread_only, in: query, schema: {type: boolean, default: false}}
      responses:
        '200': {description: 通知页, content: {application/json: {schema: {$ref: '#/components/schemas/NotificationPage'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /notifications/unread-count:
    get:
      summary: 获取未读通知数
      tags: [Notifications]
      operationId: getNotificationUnreadCount
      responses:
        '200': {description: 未读数, content: {application/json: {schema: {type: object, required: [count], properties: {count: {type: integer, minimum: 0}}}}}}
        '401': {$ref: '#/components/responses/Problem'}
  /notifications/preferences:
    get:
      summary: 获取普通站内提醒偏好
      tags: [Notifications]
      operationId: getNotificationPreferences
      responses:
        '200': {description: 普通通知开关与静默时段, content: {application/json: {schema: {$ref: '#/components/schemas/NotificationPreference'}}}}
        '401': {$ref: '#/components/responses/Problem'}
    put:
      summary: 更新普通站内提醒偏好
      tags: [Notifications]
      operationId: updateNotificationPreferences
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/NotificationPreference'}}}
      responses:
        '200': {description: 已保存, content: {application/json: {schema: {$ref: '#/components/schemas/NotificationPreference'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /notifications/read-batch:
    post:
      summary: 批量标记本人通知已读
      tags: [Notifications]
      operationId: readNotificationBatch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [notification_ids]
              properties:
                notification_ids:
                  type: array
                  minItems: 1
                  maxItems: 100
                  uniqueItems: true
                  items: {type: string, format: uuid}
      responses:
        '200':
          description: 已读通知
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/PatientNotification'}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /notifications/{notification_id}:
    get:
      summary: 读取本人通知详情
      tags: [Notifications]
      operationId: getNotification
      parameters: [{name: notification_id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200': {description: 通知详情, content: {application/json: {schema: {$ref: '#/components/schemas/PatientNotification'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /notifications/{notification_id}/read:
    post:
      summary: 标记本人通知已读
      tags: [Notifications]
      operationId: readNotification
      parameters: [{name: notification_id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200': {description: 已读通知, content: {application/json: {schema: {$ref: '#/components/schemas/PatientNotification'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /activity-records:
    get:
      summary: 游标分页读取本人活动记录
      tags: [Records]
      operationId: listActivityRecords
      parameters:
        - {name: cursor, in: query, schema: {type: string, maxLength: 512}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
        - {name: since, in: query, schema: {type: string, format: date-time}}
        - {name: until, in: query, schema: {type: string, format: date-time}}
      responses:
        '200': {description: 活动记录页, content: {application/json: {schema: {$ref: '#/components/schemas/ActivityPage'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
    post:
      summary: 创建本人活动记录
      tags: [Records]
      operationId: createActivityRecord
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ActivityWrite'}}}
      responses:
        '201': {description: 已创建, content: {application/json: {schema: {$ref: '#/components/schemas/ActivityRecord'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /activity-records/{record_id}:
    parameters: [{name: record_id, in: path, required: true, schema: {type: string, format: uuid}}]
    get:
      summary: 读取本人活动记录
      tags: [Records]
      operationId: getActivityRecord
      responses:
        '200': {description: 活动记录, content: {application/json: {schema: {$ref: '#/components/schemas/ActivityRecord'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
    patch:
      summary: 修改本人活动记录
      tags: [Records]
      operationId: patchActivityRecord
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ActivityPatch'}}}
      responses:
        '200': {description: 已修改, content: {application/json: {schema: {$ref: '#/components/schemas/ActivityRecord'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
    delete:
      summary: 软删除本人活动记录
      tags: [Records]
      operationId: deleteActivityRecord
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, additionalProperties: false, required: [record_version], properties: {record_version: {type: integer, minimum: 1}}}}}
      responses:
        '204': {description: 已删除}
        '401': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /mood-records:
    get:
      summary: 游标分页读取本人心情记录摘要
      description: 本人读取属于数据主体访问能力；账户可用时即使已撤回 mood_data_processing 仍可读取既有记录。列表不包含 note。
      tags: [Records]
      operationId: listMoodRecords
      parameters:
        - {name: cursor, in: query, schema: {type: string, maxLength: 512}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
        - {name: since, in: query, schema: {type: string, format: date-time}}
        - {name: until, in: query, schema: {type: string, format: date-time}}
      responses:
        '200': {description: 仅含时间、等级和受控情绪标签的记录页, content: {application/json: {schema: {$ref: '#/components/schemas/MoodPage'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
    post:
      summary: 创建本人心情记录
      description: 要求 health_data_processing 与 mood_data_processing 当前均有效；不要求授权第三方智能处理。
      tags: [Records]
      operationId: createMoodRecord
      parameters:
        - {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 1, maxLength: 128}}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/MoodWrite'}}}
      responses:
        '201': {description: 已创建, content: {application/json: {schema: {$ref: '#/components/schemas/MoodDetail'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /mood-records/{record_id}:
    parameters: [{name: record_id, in: path, required: true, schema: {type: string, format: uuid}}]
    get:
      summary: 读取本人心情记录详情
      description: 本人读取属于数据主体访问能力；账户可用时即使已撤回 mood_data_processing 仍可读取既有记录。
      tags: [Records]
      operationId: getMoodRecord
      responses:
        '200': {description: 本人心情记录详情, content: {application/json: {schema: {$ref: '#/components/schemas/MoodDetail'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
    patch:
      summary: 修改本人心情记录
      description: 要求 health_data_processing 与 mood_data_processing 当前均有效；须提交当前 record_version。
      tags: [Records]
      operationId: patchMoodRecord
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/MoodPatch'}}}
      responses:
        '200': {description: 已修改, content: {application/json: {schema: {$ref: '#/components/schemas/MoodDetail'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
    delete:
      summary: 软删除本人心情记录
      description: 删除作为数据主体权利，不因撤回 mood_data_processing 而关闭；立即软删除并从后续分析排除。
      tags: [Records]
      operationId: deleteMoodRecord
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, additionalProperties: false, required: [record_version], properties: {record_version: {type: integer, minimum: 1}}}}}
      responses:
        '204': {description: 已删除}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /history/timeline:
    get:
      summary: 患者混合健康历史时间线
      tags: [Records]
      operationId: getHistoryTimeline
      parameters:
        - {name: cursor, in: query, schema: {type: string, maxLength: 512}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
        - {name: category, in: query, schema: {type: array, items: {type: string, enum: [diet, stool, symptom, mood, medication_checkin, activity, advice]}}}
        - {name: since, in: query, schema: {type: string, format: date-time}}
        - {name: until, in: query, schema: {type: string, format: date-time}}
      responses:
        '200': {description: 时间线页, content: {application/json: {schema: {$ref: '#/components/schemas/HistoryPage'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '400': {$ref: '#/components/responses/Problem'}
  /trends:
    get:
      summary: 查询患者确定性历史统计
      tags: [Records]
      operationId: getTrends
      parameters:
        - {name: from, in: query, required: true, schema: {type: string, format: date-time}}
        - {name: to, in: query, required: true, schema: {type: string, format: date-time}}
        - {name: bucket, in: query, schema: {type: string, enum: [day, week], default: day}}
      description: Mood 趋势属于派生处理，不等同于原始记录的数据主体读取。仅在 health_data_processing 与 mood_data_processing 均有效时，对患者本人未删除记录的结构化 mood_level 做确定性聚合；不要求 mood_ai_sharing 或 third_party_ai，且不将数据发送给 Agent。缺少/撤回任一处理授权时，仅 mood 子结构返回 consent_required 与 missing_consents；其余趋势继续正常返回，不能将 mood 伪装成零数据。原始列表、详情和删除仍遵循数据主体访问边界。note 与 emotion_tags 不参与趋势。结果不表示诊断、病因或因果关系，时段按患者 IANA 时区切分。
      responses:
        '200': {description: 请求范围内其他趋势正常返回；mood 子结构可用或因授权不可用, content: {application/json: {schema: {$ref: '#/components/schemas/TrendResponse'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /auth/register:
    post:
      summary: 注册邮箱账户
      tags: [Auth]
      security: []
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RegisterRequest'}
      responses:
        '202':
          description: 验证邮件已受理
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AcceptedOperation'}
        '422': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
        '500': {$ref: '#/components/responses/Problem'}
  /auth/email/verify:
    post:
      summary: 验证注册邮箱
      tags: [Auth]
      security: []
      operationId: verifyEmail
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties: {token: {type: string, minLength: 20}}
      responses:
        '204': {description: 已验证}
        '422': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
        '500': {$ref: '#/components/responses/Problem'}
  /auth/login:
    post:
      summary: 邮箱密码登录
      tags: [Auth]
      security: []
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginRequest'}
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TokenPair'}
        '401': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
        '500': {$ref: '#/components/responses/Problem'}
  /auth/refresh:
    post:
      summary: 轮换刷新令牌
      tags: [Auth]
      security: []
      operationId: refreshSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties: {refresh_token: {type: string}}
      responses:
        '200':
          description: 已轮换
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TokenPair'}
        '401': {$ref: '#/components/responses/Problem'}
        '500': {$ref: '#/components/responses/Problem'}
  /auth/logout:
    post:
      summary: 退出当前会话
      tags: [Auth]
      operationId: logout
      responses:
        '204': {description: 当前会话已撤销}
        '401': {$ref: '#/components/responses/Problem'}
        '500': {$ref: '#/components/responses/Problem'}
  /auth/password/reset/request:
    post:
      summary: 请求密码重置邮件
      tags: [Auth]
      security: []
      operationId: requestPasswordReset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties: {email: {type: string, format: email}}
      responses:
        '202':
          description: 无论账户是否存在均返回已受理
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AcceptedOperation'}
        '422': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
        '500': {$ref: '#/components/responses/Problem'}
  /auth/password/reset/confirm:
    post:
      summary: 使用单次令牌重置密码
      tags: [Auth]
      security: []
      operationId: confirmPasswordReset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, new_password]
              properties:
                token: {type: string}
                new_password: {type: string, minLength: 12, maxLength: 128}
      responses:
        '204': {description: 密码已重置，旧会话全部撤销}
        '422': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
        '500': {$ref: '#/components/responses/Problem'}
  /patients/me:
    get:
      summary: 获取当前患者资料
      tags: [Profile]
      operationId: getMyProfile
      responses:
        '200':
          description: 当前患者资料
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PatientProfile'}
              examples:
                currentPatient:
                  value:
                    id: 019a0000-0000-7000-8000-000000000001
                    nickname: null
                    birth_year: 1990
                    timezone: Asia/Shanghai
                    profile_version: 1
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '500': {$ref: '#/components/responses/Problem'}
    patch:
      summary: 更新当前患者资料
      tags: [Profile]
      operationId: updateMyProfile
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PatientProfilePatch'}
            examples:
              nicknameAndVersion:
                value: {profile_version: 1, nickname: GutCare 用户}
      responses:
        '200':
          description: 已更新
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PatientProfile'}
              examples:
                updatedPatient:
                  value:
                    id: 019a0000-0000-7000-8000-000000000001
                    nickname: GutCare 用户
                    birth_year: 1990
                    timezone: Asia/Shanghai
                    profile_version: 2
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/RecordVersionConflict'}
        '422': {$ref: '#/components/responses/Problem'}
        '500': {$ref: '#/components/responses/Problem'}
  /patients/me/consents:
    post:
      summary: 记录或撤回授权
      tags: [Privacy]
      operationId: recordConsent
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ConsentDecision'}
            examples:
              grantThirdPartyAi:
                  value: {consent_type: third_party_ai, policy_version: third_party_ai-v1, granted: true}
      responses:
        '201':
          description: 已记录
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ConsentDecision'}
            examples:
              recordedDecision:
                value:
                  consent_type: third_party_ai
                  policy_version: third_party_ai-v1
                  granted: true
                  decided_at: '2026-10-15T08:30:00Z'
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
        '500': {$ref: '#/components/responses/Problem'}
  /patients/me/account-deletion:
    post:
      summary: 启动账号注销流程
      tags: [Privacy]
      operationId: requestAccountDeletion
      responses:
        '202':
          description: 账户立即冻结、撤销全部 refresh session/consent并取消任务；仅首次创建返回一次性receipt，重试复用operation且receipt为null。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PrivacyDeletionAccepted'}
              example: {operation_id: 019a0000-0000-7000-8000-000000000020, receipt: 'one-time-high-entropy-value', status: accepted}
        '401': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
        '500': {$ref: '#/components/responses/Problem'}
  /privacy/deletion-operations/{operation_id}/status:
    post:
      security: []
      summary: 使用注销receipt查询进度
      tags: [Privacy]
      operationId: getPrivacyDeletionStatus
      parameters:
        - {name: operation_id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [receipt], properties: {receipt: {type: string, minLength: 40, maxLength: 128}}, additionalProperties: false}
      responses:
        '200':
          description: 删除操作状态
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PrivacyDeletionStatus'}
        '404': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
  /privacy/exports:
    post:
      summary: 预览并创建隐私导出
      tags: [Privacy]
      operationId: createPrivacyExport
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [categories], properties: {categories: {type: array, minItems: 1, items: {type: string, enum: [profile, consents, medical_documents, files, diet, stool, symptoms, mood, medication, activity, analysis, advice, alerts, notifications]}}}, additionalProperties: false}
      responses:
        '201': {description: Export preview created}
        '401': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
    get:
      summary: 列出本人导出
      tags: [Privacy]
      operationId: listPrivacyExports
      responses:
        '200': {description: 本人导出列表}
        '401': {$ref: '#/components/responses/Problem'}
  /privacy/exports/{export_id}:
    get:
      summary: 查询本人导出状态
      tags: [Privacy]
      operationId: getPrivacyExport
      parameters:
        - {name: export_id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: 导出状态及短期下载能力}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
    post:
      summary: 确认生成本人导出
      tags: [Privacy]
      operationId: confirmPrivacyExport
      parameters:
        - {name: export_id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '202': {description: 导出进入异步队列}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
