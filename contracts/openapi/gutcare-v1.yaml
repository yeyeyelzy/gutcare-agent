      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: false, required: [record_version], properties: {record_version: {type: integer, minimum: 1}}}
      responses:
        '200': {description: 已确认保留双方事实, content: {application/json: {schema: {$ref: '#/components/schemas/MedicalFactConflictResolution'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /medical-field-candidates/{candidate_id}/decision:
    post:
      summary: 对一个字段候选作出患者决定；幂等摘要为规范化 action 与 corrected_value，同键同摘要（含候选脱敏后）返回空 204 且不新增审计/事实，异摘要或候选返回 409
      tags: [Records]
      operationId: decideMedicalFieldCandidate
      parameters:
        - {name: candidate_id, in: path, required: true, schema: {type: string, format: uuid}}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MedicalCandidateDecision'}
      responses:
        '204': {description: 决定已处理或幂等重放；新决定追加审计，accept/correct 生成独立确认事实；无响应正文}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}

  /files/{file_id}/download-grants:
    post:
