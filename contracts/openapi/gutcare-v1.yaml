      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RecordImageRecognitionCreate'}}}}
      responses: {'202': {description: Recognition queued; candidate values are not patient facts, content: {application/json: {schema: {$ref: '#/components/schemas/RecordImageRecognitionRequest'}}}}, '401': {$ref: '#/components/responses/Problem'}, '404': {$ref: '#/components/responses/Problem'}, '409': {$ref: '#/components/responses/Problem'}, '422': {$ref: '#/components/responses/Problem'}, '503': {$ref: '#/components/responses/Problem'}}
  /stool-records/{record_id}/image-recognition-requests:
    post:
      tags: [Records]
      operationId: createStoolImageRecognitionRequest
      parameters: [{$ref: '#/components/parameters/RecordId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RecordImageRecognitionCreate'}}}}
      responses: {'202': {description: Recognition queued; candidate values are not patient facts, content: {application/json: {schema: {$ref: '#/components/schemas/RecordImageRecognitionRequest'}}}}, '401': {$ref: '#/components/responses/Problem'}, '404': {$ref: '#/components/responses/Problem'}, '409': {$ref: '#/components/responses/Problem'}, '422': {$ref: '#/components/responses/Problem'}, '503': {$ref: '#/components/responses/Problem'}}
  /record-image-recognition-disclosures:
    get:
      tags: [Records]
      operationId: getRecordImageRecognitionDisclosure
      parameters: [{name: purpose, in: query, required: true, schema: {type: string, enum: [diet_image_recognition, stool_image_recognition]}}]
      responses: {'200': {description: Current purpose-specific notice; production returns enabled=false if no signed notice is configured, content: {application/json: {schema: {$ref: '#/components/schemas/RecordImageDisclosure'}}}}, '401': {$ref: '#/components/responses/Problem'}, '422': {$ref: '#/components/responses/Problem'}}
    post:
      tags: [Records]
      operationId: acknowledgeRecordImageRecognitionDisclosure
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RecordImageDisclosureAcknowledgment'}}}}
      responses: {'201': {description: One-time five-minute disclosure token bound to patient, record, purpose and versions; plaintext is returned once, content: {application/json: {schema: {$ref: '#/components/schemas/RecordImageDisclosureToken'}}}}, '401': {$ref: '#/components/responses/Problem'}, '404': {$ref: '#/components/responses/Problem'}, '409': {$ref: '#/components/responses/Problem'}, '422': {$ref: '#/components/responses/Problem'}}
  /record-image-recognition-requests/{request_id}:
    get:
      tags: [Records]
      operationId: getRecordImageRecognitionRequest
      parameters: [{name: request_id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses: {'200': {description: Request state and item candidates, content: {application/json: {schema: {$ref: '#/components/schemas/RecordImageRecognitionRequest'}}}}, '401': {$ref: '#/components/responses/Problem'}, '404': {$ref: '#/components/responses/Problem'}}
  /record-image-recognition-requests/{request_id}/retry:
    post:
      tags: [Records]
      operationId: retryRecordImageRecognitionRequest
      parameters: [{name: request_id, in: path, required: true, schema: {type: string, format: uuid}}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RecordImageRecognitionCreate'}}}}
      responses:
        '202': {description: New request created from current source state; retry_of_request_id identifies the terminal parent, content: {application/json: {schema: {$ref: '#/components/schemas/RecordImageRecognitionRequest'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {description: RFC 9457; codes include RECORD_IMAGE_RETRY_NOT_ALLOWED (parent nonterminal/already retried/active child), RECORD_VERSION_CONFLICT, CONSENT_REQUIRED, and IDEMPOTENCY_CONFLICT; no retry is created, content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
        '422': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /record-image-candidates/{candidate_id}/decision:
    post:
      tags: [Records]
      operationId: decideRecordImageCandidate
      parameters: [{name: candidate_id, in: path, required: true, schema: {type: string, format: uuid}}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RecordImageCandidateDecision'}}}}
      responses:
        '204': {description: One candidate decision recorded; replay is idempotent}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409':
          description: Version/idempotency conflict or food field dependency not met; dependency failure has no state or fact side effects and leaves the candidate pending.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
              examples:
                candidateDependencyUnmet:
                  value: {type: 'https://gutcare.invalid/problems/candidate_dependency_unmet', title: Candidate dependency unmet, status: 409, detail: Confirm or edit this group's food_name first., instance: /api/v1/record-image-candidates/019a0000-0000-7000-8000-000000000032/decision, code: candidate_dependency_unmet, request_id: '00000000-0000-4000-8000-000000000409'}
        '422': {$ref: '#/components/responses/Problem'}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 8, maxLength: 128}
    UploadId:
      name: upload_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    RecordId:
      name: record_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    RecordType:
      name: record_type
      in: path
      required: true
      schema:
        type: string
        enum: [diet-records, stool-records, symptom-records]
  responses:
    Problem:
      description: RFC 9457 Problem Details
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    AnalysisTaskCursorProblem:
      description: 游标签名、患者作用域、limit 或排序版本无效。
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
          examples:
            invalid_cursor:
              value: {type: 'https://gutcare.invalid/problems/invalid_cursor', title: Request failed, status: 400, detail: Analysis task cursor is invalid, instance: /api/v1/analysis-tasks, code: INVALID_CURSOR, request_id: '00000000-0000-4000-8000-000000000400'}
    AnalysisTaskAuthProblem:
      description: 需要有效的患者会话。
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
          examples:
            authentication_required:
              value: {type: 'https://gutcare.invalid/problems/authentication_required', title: Request failed, status: 401, detail: Authentication required, instance: /api/v1/analysis-tasks, code: AUTHENTICATION_REQUIRED, request_id: '00000000-0000-4000-8000-000000000401'}
    AnalysisTaskNotFoundProblem:
      description: 资源不存在或当前不可用。
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
          examples:
            resource_not_found:
              value: {type: 'https://gutcare.invalid/problems/resource_not_found', title: Request failed, status: 404, detail: Resource not found, instance: /api/v1/analysis-tasks, code: RESOURCE_NOT_FOUND, request_id: '00000000-0000-4000-8000-000000000404'}
    AnalysisTaskConflictProblem:
      description: 授权或任务状态不允许当前操作。
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
          examples:
            task_state_conflict:
              value: {type: 'https://gutcare.invalid/problems/task_state_conflict', title: Request failed, status: 409, detail: Analysis task state or authorization conflict, instance: /api/v1/analysis-tasks, code: TASK_STATE_CONFLICT, request_id: '00000000-0000-4000-8000-000000000409'}
    AnalysisTaskValidationProblem:
      description: 请求字段或路径参数校验失败。
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
          examples:
            validation_error:
              value: {type: 'https://gutcare.invalid/problems/validation_error', title: Request validation failed, status: 422, detail: Request validation failed, instance: /api/v1/analysis-tasks, code: VALIDATION_ERROR, request_id: '00000000-0000-4000-8000-000000000422'}
    AnalysisTaskInternalProblem:
      description: 服务暂不可用。
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
          examples:
            internal_error:
              value: {type: 'https://gutcare.invalid/problems/internal_error', title: Request failed, status: 500, detail: Service temporarily unavailable, instance: /api/v1/analysis-tasks, code: INTERNAL_ERROR, request_id: '00000000-0000-4000-8000-000000000500'}
    HistoryInvalidCursor:
      description: RFC 9457 Problem Details - cursor tampering or filter mismatch
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
          example: {type: 'https://gutcare.invalid/problems/invalid_cursor', title: '时间线游标无效', status: 400, detail: 'History cursor is invalid', instance: '/api/v1/history/timeline', code: INVALID_CURSOR, request_id: '00000000-0000-4000-8000-000000000001'}
    HistoryValidationProblem:
      description: RFC 9457 Problem Details - invalid time range, category or pagination parameters
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
          example: {type: 'https://gutcare.invalid/problems/validation_error', title: 'Request validation failed', status: 422, detail: 'History time range must be timezone-aware and non-empty', instance: '/api/v1/history/timeline', code: VALIDATION_ERROR, request_id: '00000000-0000-4000-8000-000000000002', errors: []}
    TrendValidationProblem:
      description: 趋势时间范围或 bucket 参数无效
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
          example: {type: 'https://gutcare.invalid/problems/validation_error', title: 'Request validation failed', status: 422, detail: 'Trend bounds must include timezone and define a non-empty range', instance: '/api/v1/trends', code: VALIDATION_ERROR, request_id: '00000000-0000-4000-8000-000000000002', errors: []}
    PrivacyExportProblem404:
      description: RFC 9457 Problem Details - export not found or capability expired/used
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
          example: {type: 'https://gutcare.invalid/problems/resource_not_found', title: 'Resource not found', status: 404, detail: 'Export not found or capability unavailable.', instance: '/api/v1/privacy/exports/00000000-0000-4000-8000-000000000000', code: RESOURCE_NOT_FOUND, request_id: '00000000-0000-4000-8000-000000000404'}
    PrivacyExportProblem409:
      description: RFC 9457 Problem Details - invalid export state transition
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
          example: {type: 'https://gutcare.invalid/problems/idempotency_conflict', title: 'Export state conflict', status: 409, detail: 'Export cannot be confirmed in its current state.', instance: '/api/v1/privacy/exports/019a0000-0000-7000-8000-000000000201', code: IDEMPOTENCY_CONFLICT, request_id: '00000000-0000-4000-8000-000000000409'}
    PrivacyExportProblem422:
      description: RFC 9457 Problem Details - invalid export request or capability
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
          example: {type: 'https://gutcare.invalid/problems/validation_error', title: 'Request validation failed', status: 422, detail: 'Unsupported export category.', instance: '/api/v1/privacy/exports', code: VALIDATION_ERROR, request_id: '00000000-0000-4000-8000-000000000422'}
    PrivacyExportPathProblem422:
      description: RFC 9457 Problem Details - export_id path parameter must be a UUID
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
          example: {type: 'https://gutcare.invalid/problems/validation_error', title: 'Request validation failed', status: 422, detail: '导出 ID 格式无效。', instance: '/api/v1/privacy/exports/not-a-uuid', code: VALIDATION_ERROR, request_id: '00000000-0000-4000-8000-000000000422'}
    PrivacyExportProblem503:
      description: RFC 9457 Problem Details - export service unavailable
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
          example: {type: 'https://gutcare.invalid/problems/service_unavailable', title: 'Service unavailable', status: 503, detail: 'Encrypted export is unavailable.', instance: '/api/v1/privacy/exports', code: SERVICE_UNAVAILABLE, request_id: '00000000-0000-4000-8000-000000000503'}
    RecordVersionConflict:
      description: 提交的 profile_version 已过期；重新 GET 后再应用 PATCH。
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
          example:
            type: https://gutcare.invalid/problems/record_version_conflict
            title: Patient profile has changed
            status: 409
            detail: Reload the profile and retry your update.
            instance: /api/v1/patients/me
            code: RECORD_VERSION_CONFLICT
            request_id: 019a0000-0000-7000-8000-000000000099
  schemas:
    MedicationPlanCreate:
      type: object
      additionalProperties: false
      required: [medication_name, source_type]
      properties:
        medication_name: {type: string, minLength: 1, maxLength: 160}
        dosage_text: {type: [string, 'null'], maxLength: 160, description: 按来源原文保存，不推断剂量}
        route_code: {type: [string, 'null'], maxLength: 32}
        start_date: {type: [string, 'null'], format: date}
        end_date: {type: [string, 'null'], format: date}
        source_type: {type: string, enum: [manual, medical_document]}
        source_document_id: {type: [string, 'null'], format: uuid, description: 仅允许同患者医疗档案}
    MedicationPlanPatch:
      type: object
      additionalProperties: false
      required: [record_version]
      properties:
        record_version: {type: integer, minimum: 1}
        medication_name: {type: string, minLength: 1, maxLength: 160}
        dosage_text: {type: [string, 'null'], maxLength: 160}
        route_code: {type: [string, 'null'], maxLength: 32}
