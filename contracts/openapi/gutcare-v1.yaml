      responses:
        '200': {description: 冲突详情, content: {application/json: {schema: {$ref: '#/components/schemas/MedicalFactConflict'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /medical-fact-conflicts/{conflict_id}/resolve:
    post:
      summary: 患者明确选择保留全部来源事实，不自动择优
