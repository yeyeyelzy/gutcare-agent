  /analysis-tasks/preview:
    get:
      summary: 预览综合分析范围内的心情记录计数
      tags: [Analysis]
      operationId: previewAnalysisTask
      security: [{BearerAuth: []}]
      description: 返回当前患者指定分析类型/时间范围内的 mood 计数，仅为创建前预览建议。requested_from/to 表示 UTC 时间戳的半开区间 [from,to)，两者均省略时使用该 analysis_type 的默认时间范围；若只提供一端，另一端按该分析类型默认边界补齐。范围内计数统计本人未删除记录；计入预览 eligible 的 mood 还需 health_data_processing、mood_data_processing、mood_ai_sharing、third_party_ai 四项授权全部有效。缺失 mood 专项授权只排除 mood，不改变其他符合条件输入。health_data_processing 或 third_party_ai 是现行 F08 整体任务的基础授权；缺少任一项时按既有 F08 授权错误拒绝预览。预览与创建之间记录/授权可能变化，POST /analysis-tasks 必须在同一创建事务和患者 consent fence 内重新计算并冻结实际输入；本响应不保证与后续任务快照计数相同。
      parameters:
        - {name: analysis_type, in: query, required: true, schema: {type: string, enum: [comprehensive_health_analysis, periodic_summary]}}
        - {name: requested_from, in: query, schema: {type: string, format: date-time}, description: Optional UTC start; if omitted, use the analysis type's default range.}
        - {name: requested_to, in: query, schema: {type: string, format: date-time}, description: Optional UTC end; if omitted, use the analysis type's default range.}
      responses:
        '200': {description: 当前范围的心情输入预览, content: {application/json: {schema: {$ref: '#/components/schemas/AnalysisTaskPreview'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
