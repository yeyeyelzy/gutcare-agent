name: gutcare

services:
  postgres:
    image: postgres:18.0-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_BOOTSTRAP_USER:?Set POSTGRES_BOOTSTRAP_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_BOOTSTRAP_PASSWORD:?Set POSTGRES_BOOTSTRAP_PASSWORD in .env}
      GUTCARE_MIGRATOR_PASSWORD: ${GUTCARE_MIGRATOR_PASSWORD:?Set GUTCARE_MIGRATOR_PASSWORD in .env}
      GUTCARE_APP_PASSWORD: ${GUTCARE_APP_PASSWORD:?Set GUTCARE_APP_PASSWORD in .env}
      GUTCARE_WORKER_PASSWORD: ${GUTCARE_WORKER_PASSWORD:?Set GUTCARE_WORKER_PASSWORD in .env}
      GUTCARE_ANALYSIS_WORKER_PASSWORD: ${GUTCARE_ANALYSIS_WORKER_PASSWORD:?Set GUTCARE_ANALYSIS_WORKER_PASSWORD in .env}
      GUTCARE_NOTIFICATION_WORKER_PASSWORD: ${GUTCARE_NOTIFICATION_WORKER_PASSWORD:?Set GUTCARE_NOTIFICATION_WORKER_PASSWORD in .env}
      GUTCARE_PRIVACY_WORKER_PASSWORD: ${GUTCARE_PRIVACY_WORKER_PASSWORD:?Set GUTCARE_PRIVACY_WORKER_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/18/docker
      - ./infra/postgres/init/010-gutcare-roles.sh:/docker-entrypoint-initdb.d/010-gutcare-roles.sh:ro
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:8.0.2-bookworm
    command: ["sh", "-ec", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.27.8
    environment:
      MP_DATABASE: /data/mailpit.db
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
    volumes:
      - mailpit_data:/data
    networks: [backend]
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  minio:
    image: gutcare-minio:source-${MINIO_SOURCE_COMMIT:?Set audited MINIO_SOURCE_COMMIT in .env}
    pull_policy: never
    command: ["server", "/data", "--address", ":9000", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    expose: ["9000", "9001"]
    volumes:
      - minio_data:/data
    networks: [backend]
    restart: unless-stopped

  gateway:
    image: caddy:2.10.0-alpine
    ports:
      - "127.0.0.1:${GATEWAY_HTTP_PORT:-8080}:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge, backend]
    depends_on:
      minio:
        condition: service_started
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

networks:
  edge:
  backend:
    internal: true

volumes:
  postgres_data:
  redis_data:
  mailpit_data:
  minio_data:
  caddy_data:
  caddy_config:
