name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v5
        with:
          version: '0.13.1'
      - name: Backend format, lint, types, and tests
        shell: pwsh
        working-directory: backend
        run: |
          uv sync --locked --python python
          uv run --locked --python python ruff format --check .
          uv run --locked --python python ruff check .
          uv run --locked --python python mypy src
          uv run --locked --python python pytest -m "not integration"
      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          Get-ChildItem -Recurse -Filter *.ps1 -File | ForEach-Object {
            $tokens = $null
            $errors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) { throw "PowerShell parse failed for $($_.FullName): $($errors -join '; ')" }
          }

  agent:
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Agent runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils
          python -m pip install --disable-pip-version-check -r agent/requirements.txt Pillow
      - name: Agent tests
        working-directory: agent
        run: python -m unittest discover -s tests -p 'test_*.py'

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare Gradle wrapper
        working-directory: android
        run: chmod +x gradlew
      - name: Build native Android app
        working-directory: android
        run: ./gradlew :app:assembleDebug --no-daemon --max-workers=2
      - name: Run native Android unit tests
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest --no-daemon --max-workers=2 --info
      - name: Lint native Android app
        working-directory: android
        run: ./gradlew :app:lintDebug --no-daemon --max-workers=2
