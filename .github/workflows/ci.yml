name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  foundation:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.16'
      - uses: astral-sh/setup-uv@v5
        with:
          version: '0.13.1'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK platform
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:ANDROID_HOME) -or -not (Test-Path -LiteralPath $env:ANDROID_HOME -PathType Container)) {
            throw 'The windows-latest image must provide ANDROID_HOME.'
          }
          $env:ANDROID_SDK_ROOT = $env:ANDROID_HOME
          $sdkmanagerCommand = Get-Command sdkmanager.bat -ErrorAction SilentlyContinue
          if (-not $sdkmanagerCommand) { $sdkmanagerCommand = Get-Command sdkmanager -ErrorAction SilentlyContinue }
          if ($sdkmanagerCommand -and (Test-Path -LiteralPath $sdkmanagerCommand.Source -PathType Leaf)) {
            $sdkmanager = $sdkmanagerCommand.Source
          } else {
            $cmdlineToolsRoot = Join-Path $env:ANDROID_HOME 'cmdline-tools'
            $sdkmanagers = @(Get-ChildItem -LiteralPath $cmdlineToolsRoot -Filter 'sdkmanager.bat' -File -Recurse -ErrorAction SilentlyContinue)
            $sdkmanager = $sdkmanagers |
              Where-Object { $_.FullName -match '[\\/]cmdline-tools[\\/]latest[\\/]bin[\\/]sdkmanager\.bat$' } |
              Select-Object -First 1 -ExpandProperty FullName
            if (-not $sdkmanager) {
              $versionedTools = foreach ($candidate in $sdkmanagers) {
                $versionName = Split-Path (Split-Path $candidate.DirectoryName -Parent) -Leaf
                $parsedVersion = $null
                if ([version]::TryParse($versionName, [ref]$parsedVersion)) {
                  [pscustomobject]@{ Path = $candidate.FullName; Version = $parsedVersion }
                }
              }
              $sdkmanager = $versionedTools | Sort-Object Version -Descending | Select-Object -First 1 -ExpandProperty Path
            }
          }
          if (-not $sdkmanager) { throw 'Android sdkmanager was not found on PATH or under ANDROID_HOME\cmdline-tools.' }
          $sdkmanagerDirectory = Split-Path -Parent $sdkmanager
          $env:PATH = "$sdkmanagerDirectory;$env:ANDROID_HOME\platform-tools;$env:PATH"
          1..100 | ForEach-Object { 'y' } | & $sdkmanager --licenses
          if ($LASTEXITCODE -ne 0) { throw 'Android SDK license acceptance failed.' }
          & $sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
          if ($LASTEXITCODE -ne 0) { throw 'Android SDK platform/build-tools installation failed.' }
      - name: Configure Gradle cache
        uses: gradle/actions/setup-gradle@v4
      - name: Validate pinned toolchain
        shell: pwsh
        run: |
          $env:GUTCARE_PYTHON = (Get-Command python).Source
          $env:GUTCARE_UV = (Get-Command uv).Source
          $python = ./scripts/resolve-python.ps1
          $uv = ./scripts/resolve-uv.ps1
          if ((& $uv --version) -notmatch '^uv 0\.13\.1(?:\s|$)') { throw 'uv 0.13.1 is required.' }
      - name: Unified local and CI checks
        shell: pwsh
        env:
          VITE_API_BASE_URL: https://api.ci.invalid/api/v1
        run: |
          $env:GUTCARE_PYTHON = (Get-Command python).Source
          $env:GUTCARE_UV = (Get-Command uv).Source
          ./scripts/lint.ps1
          if (-not $?) { throw 'Lint checks failed.' }
          ./scripts/test.ps1 -Suite unit
          if (-not $?) { throw 'Unit checks failed.' }
          ./scripts/test.ps1 -Suite contract
          if (-not $?) { throw 'Contract checks failed or did not execute tests.' }
      - name: Verify native Android app
        shell: pwsh
        working-directory: android
        run: .\gradlew.bat :app:assembleDebug :app:testDebugUnitTest :app:lintDebug --no-daemon --max-workers=2
      - name: Validate registration notice source
        shell: pwsh
        run: |
          ./scripts/validate-registration-notices.ps1
          ./scripts/test-registration-notice-validator.ps1
      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          Get-ChildItem scripts/*.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) { throw "PowerShell parse failed for $($_.Name): $($errors -join '; ')" }
          }
