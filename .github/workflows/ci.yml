name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  foundation:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.16'
      - uses: astral-sh/setup-uv@v5
        with:
          version: '0.13.1'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - name: Enable pinned pnpm
        shell: pwsh
        run: |
          corepack enable
          corepack install --global pnpm@10.28.0
      - name: Configure pnpm dependency cache
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Validate pinned toolchain
        shell: pwsh
        run: |
          $env:GUTCARE_PYTHON = (Get-Command python).Source
          $env:GUTCARE_UV = (Get-Command uv).Source
          $env:GUTCARE_NODE = (Get-Command node).Source
          $python = ./scripts/resolve-python.ps1
          $uv = ./scripts/resolve-uv.ps1
          $node = ./scripts/resolve-node.ps1
          if ((& $node --version) -notmatch '^v22\.') { throw 'Node 22 is required.' }
          $pnpm = Join-Path $env:APPDATA 'npm\pnpm.cmd'
          if (-not (Test-Path $pnpm)) { $pnpm = (Get-Command pnpm -ErrorAction Stop).Source }
          if ((& $pnpm --version) -ne '10.28.0') { throw 'pnpm 10.28.0 is required.' }
          if ((& $uv --version) -notmatch '^uv 0\.13\.1(?:\s|$)') { throw 'uv 0.13.1 is required.' }
      - name: Install APP dependencies from workspace lock
        shell: pwsh
        run: |
          $env:GUTCARE_NODE = (Get-Command node).Source
          ./scripts/install-app.ps1
      - name: Unified local and CI checks
        shell: pwsh
        env:
          VITE_API_BASE_URL: https://api.ci.invalid/api/v1
        run: |
          $env:GUTCARE_PYTHON = (Get-Command python).Source
          $env:GUTCARE_UV = (Get-Command uv).Source
          $env:GUTCARE_NODE = (Get-Command node).Source
          ./scripts/lint.ps1
          if (-not $?) { throw 'Lint checks failed.' }
          ./scripts/test.ps1 -Suite unit
          if (-not $?) { throw 'Unit checks failed.' }
          ./scripts/app-build.ps1
          if (-not $?) { throw 'APP Android/iOS builds failed.' }
      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          Get-ChildItem scripts/*.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) { throw "PowerShell parse failed for $($_.Name): $($errors -join '; ')" }
          }
